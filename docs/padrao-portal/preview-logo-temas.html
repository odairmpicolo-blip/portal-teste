<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia — logos Portal CIOP</title>
<script src="../../assets/js/theme-toggle.js?v=20261029fav2"></script>
<link rel="stylesheet" href="../../assets/css/portal-brand.css?v=20261029logo1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;min-height:100vh;padding:24px}
html.dk-light body{background:#e8eef6;color:#102c53}
html.dk-dark body{background:#0b1628;color:#e2e8f0}
h1{font-size:16px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.card{background:rgba(255,255,255,.72);border:1px solid rgba(16,44,83,.12);border-radius:16px;padding:16px 18px;min-width:min(320px,100%)}
html.dk-dark .card{background:rgba(18,40,68,.72);border-color:rgba(180,210,240,.18)}
.card p{margin:0 0 10px;font-size:12px;font-weight:700}
header.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.8);margin-bottom:16px}
html.dk-dark header.demo{background:rgba(12,28,48,.85)}
.side{width:200px;padding:12px;border-radius:14px;background:rgba(255,255,255,.55)}
html.dk-dark .side{background:rgba(12,28,48,.7)}
.home-logo,.portal-brand-art{object-fit:contain}
.login-sample .portal-brand-art{height:auto;width:min(280px,70vw);max-height:96px;max-width:280px}
.side .home-logo{max-width:156px;max-height:58px;height:auto}
</style>
</head>
<body>
<h1>Logos conforme o tema efetivo (<span id="modo"></span>)</h1>
<header class="demo">
  <a class="portal-brand-mark" href="../../index.html" aria-label="Portal CIOP TCGL Operações">
    <img class="portal-brand-art" src="../../assets/img/portal-ciop-claro.png?v=20261029logo1" width="1024" height="349" alt="Portal CIOP TCGL Operações">
  </a>
  <strong>Título da página</strong>
  <span>Usuário</span>
</header>
<div class="row">
  <div class="side">
    <p>Lateral home</p>
    <img class="home-logo" src="../../assets/img/portal-ciop-claro.png?v=20261029logo1" width="1024" height="349" alt="Portal CIOP TCGL Operações">
  </div>
  <div class="card login-sample">
    <p>Login / carregamento</p>
    <img class="portal-brand-art login-corner-logo" src="../../assets/img/portal-ciop-claro.png?v=20261029logo1" width="1024" height="349" alt="Portal CIOP TCGL Operações">
  </div>
</div>
<script>
document.getElementById('modo').textContent =
  (document.documentElement.getAttribute('data-dk-pref') || 'auto') +
  ' → ' +
  (document.documentElement.getAttribute('data-dk-resolved') || '');
</script>
</body>
</html>
