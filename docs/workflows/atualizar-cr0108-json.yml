name: Atualizar JSON CR-0108 a partir do DSQL

on:
  schedule:
    # 08:00 America/São_Paulo (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cr0108-json:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Dependências da API (DSQL)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Exportar agregados do cr_0108
        env:
          DSQL_CLUSTER_ID: ${{ secrets.DSQL_CLUSTER_ID }}
          DSQL_REGION: sa-east-1
          DSQL_USER: admin
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: sa-east-1
        run: node scripts/exportar-cr0108-json.mjs

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar JSON do CR-0108
        run: bash scripts/ci-git-commit-push.sh "Atualiza JSON do CR-0108 a partir do banco" assets/data/cr0108/
