name: Atualizar JSON CAD no fim do mês

# Copiar para .github/workflows/atualizar-incidentes-cad.yml se o token
# não tiver escopo workflow. Cron: dia 1, 06:00 UTC (03:00 em São Paulo).

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cad-mes-fechado:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: backend
        run: npm ci --omit=dev
      - env:
          DSQL_CLUSTER_ID: ${{ secrets.DSQL_CLUSTER_ID }}
          DSQL_REGION: sa-east-1
          DSQL_USER: admin
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: sa-east-1
          CAD_JSON_MODO: mes-fechado
        run: node scripts/atualizar-incidentes-cad-json.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bash scripts/ci-git-commit-push.sh "Atualiza JSON do CAD com o mês que fechou" assets/data/incidentes-cad.json assets/data/incidentes-cad/
