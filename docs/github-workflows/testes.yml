name: Testes da API

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "scripts/lib/**"
      - "package.json"

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rodar testes
        run: npm test
