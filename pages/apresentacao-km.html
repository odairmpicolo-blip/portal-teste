<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proposta integral | Portal CIOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@420;560;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#030814; --ink:#f3f7ff; --muted:#c5d4e8; --line:rgba(120,190,255,.22);
    --cyan:#3de1ff; --orange:#ff6a2c; --green:#2ee6a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif}
  body{overflow:hidden}
  .stage{position:relative;height:100%;display:flex;flex-direction:column}
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .sky .grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(61,225,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(61,225,255,.07) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 72%);opacity:.55}
  .orb{position:absolute;border-radius:50%;filter:blur(18px);opacity:.7}
  .orb-a{width:420px;height:420px;left:-80px;top:-90px;background:radial-gradient(circle,#1d6dff 0%,transparent 68%)}
  .orb-b{width:380px;height:380px;right:-60px;bottom:-80px;background:radial-gradient(circle,#ff4d2a 0%,transparent 70%)}
  .orb-c{width:280px;height:280px;left:46%;top:8%;background:radial-gradient(circle,#3de1ff 0%,transparent 68%);opacity:.35}
  @keyframes drift{50%{transform:translate3d(16px,-14px,0)}}
  .orb-a{animation:drift 16s ease-in-out infinite}
  .orb-b{animation:drift 20s ease-in-out infinite reverse}
  .hud{position:fixed;inset:12px;z-index:5;pointer-events:none}
  .hud span{position:absolute;width:26px;height:26px;border:2px solid rgba(61,225,255,.75);filter:drop-shadow(0 0 6px rgba(61,225,255,.85))}
  .hud span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  .hud span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  .hud span:nth-child(3){bottom:56px;left:0;border-right:0;border-top:0}
  .hud span:nth-child(4){bottom:56px;right:0;border-left:0;border-top:0}
  body.na-capa .hud{visibility:hidden}
  header:after{content:"";position:absolute;left:8%;right:8%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--orange),var(--green),transparent)}
  header{position:relative;z-index:2;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(6,12,28,.82),rgba(6,12,28,.4));backdrop-filter:blur(16px)}
  .brand{display:flex;align-items:center;gap:10px;min-width:180px}
  .brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 0 0 1px rgba(61,225,255,.4),0 0 18px rgba(61,225,255,.35)}
  .brand strong{display:block;font-family:Sora,sans-serif;letter-spacing:.12em;font-size:13px}
  .brand small{color:var(--muted);letter-spacing:.14em;font-size:12px}
  .cenarios{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .cenarios button{border:0;background:transparent;color:var(--muted);font:800 15px/1 Outfit,sans-serif;letter-spacing:.04em;padding:12px 16px;border-radius:999px;cursor:pointer}
  .cenarios button.on{color:#1a0a04;background:var(--orange)}
  .cenarios button[data-cenario="2"].on{color:#041018;background:var(--cyan)}
  nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  nav button{font:700 15px/1 Outfit,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:9px 12px;cursor:pointer}
  nav button.on,nav button:hover{color:#fff;border-color:rgba(61,225,255,.45);background:rgba(61,225,255,.14);box-shadow:0 0 16px rgba(61,225,255,.22)}
  .count{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:800;letter-spacing:.08em;font-size:16px}
  #pager{padding:7px 11px;border:1px solid rgba(61,225,255,.5);border-radius:999px;box-shadow:0 0 14px rgba(61,225,255,.28)}
  #ajusteVivo{color:var(--orange);letter-spacing:.04em;text-shadow:0 0 12px rgba(255,106,44,.55)}
  .portal-back{color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
  .portal-back:hover{color:#fff}
  main{position:relative;z-index:1;flex:1;min-height:0}
  .slide{height:100%;padding:16px 36px 8px;display:flex;flex-direction:column;gap:10px}
  .slide.capa{padding:0;gap:0}
  .slide.capa img{width:100%;height:100%;object-fit:cover;object-position:center}
  .kicker{color:var(--cyan);font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .kicker:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);vertical-align:1px}
  h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 22px rgba(61,225,255,.45)}
  h1{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.96;margin:6px 0 0;font-size:clamp(42px,4.6vw,68px)}
  .lead{max-width:1100px;color:#e8f2fc;font-size:22px;line-height:1.35;margin:8px 0 0}
  .glass{position:relative;overflow:hidden;border:1px solid rgba(140,210,255,.32);border-radius:22px;background:linear-gradient(160deg,rgba(18,40,78,.82),rgba(6,12,28,.78));box-shadow:0 18px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.12),0 0 24px rgba(61,225,255,.08);padding:16px 18px}
  .glass:before{content:"";position:absolute;inset:0 auto auto 0;width:160px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);box-shadow:0 0 12px var(--cyan)}
  .pick{border-color:rgba(61,225,255,.7);box-shadow:0 0 0 1px rgba(61,225,255,.35),0 18px 40px rgba(0,0,0,.28)}
  .pick.a{border-color:rgba(255,106,44,.75);box-shadow:0 0 0 1px rgba(255,106,44,.35),0 18px 40px rgba(0,0,0,.28)}
  .stat-k{color:#d5e4f6;font-size:16px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
  .stat-v{font-family:Sora,sans-serif;font-size:clamp(48px,4.6vw,76px);letter-spacing:-.04em;line-height:.92;margin-top:6px}
  .stat-v.orange{color:var(--orange);text-shadow:0 0 26px rgba(255,106,44,.42)} .stat-v.cyan{color:var(--cyan);text-shadow:0 0 26px rgba(61,225,255,.4)} .stat-v.green{color:var(--green);text-shadow:0 0 26px rgba(46,230,166,.38)}
  .stat-s{color:#e8f2fc;margin-top:8px;font-size:20px;line-height:1.3}
  .lead b{font-family:Sora,sans-serif;font-size:32px;letter-spacing:-.03em;color:var(--orange);font-weight:800;font-variant-numeric:tabular-nums}
  .faixa-linhas{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline;margin-top:12px}
  .faixa-linhas span{color:#d5e6f8;font-size:20px;font-weight:700}
  .faixa-linhas b{font-family:Sora,sans-serif;font-size:clamp(40px,3.2vw,56px);letter-spacing:-.04em;line-height:1;color:var(--orange);font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,106,44,.4)}
  .quad .faixa-linhas b{font-size:clamp(52px,4.4vw,72px)}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
  .quad .glass{display:flex;flex-direction:column;justify-content:center;padding:22px 28px}
  .quad .stat-v{font-size:clamp(64px,6.2vw,108px)}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1}
  .kpi-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1}
  .kpi-row .glass,.kpi-3 .glass{display:flex;flex-direction:column;justify-content:center}
  .kpi-3 .glass{container-type:inline-size}
  .kpi-3 .stat-v{font-size:clamp(44px,18cqi,108px);white-space:nowrap}
  .kpi-row .stat-v{font-size:clamp(42px,3.6vw,64px)}
  .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
  .tres .glass,.pair-big .glass{display:flex;flex-direction:column;justify-content:center}
  .pair-big{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
  .pair-big .stat-v{font-size:clamp(56px,5.4vw,92px)}
  .fronts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fronts p{margin:8px 0 0;color:#d5e6f8;font-size:20px;line-height:1.35}
  .chart-slim{height:176px;flex:none;padding:10px 14px 6px;display:flex;flex-direction:column}
  .chart-slim canvas{width:100%!important;flex:1;min-height:0}
  .chart-slim .stat-k{margin-bottom:4px}
  .esp-list,.km-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 28px;align-content:start;flex:1;min-height:0}
  .esp-list.curta{grid-template-columns:minmax(0,860px)}
  .esp-row,.km-row{display:grid;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .esp-row{grid-template-columns:176px minmax(0,1fr);padding:5px 0;min-width:0}
  .esp-row.para{grid-template-columns:188px minmax(0,1fr)}
  .esp-row .code,.km-row .code{font-family:Sora,sans-serif;font-size:30px}
  .esp-list.curta .code{font-size:36px}
  .esp-row .mins{min-width:0;color:#e8f2fc}
  .esp-row .hora{display:block;color:var(--cyan);font-size:20px;font-weight:800;line-height:1.2}
  .esp-row .troca{display:flex;align-items:baseline;gap:10px;margin-top:1px;white-space:nowrap}
  .esp-row .troca i,.esp-row .seta{font-style:normal;font-size:18px;font-weight:800;color:#9fb0c8}
  .esp-row .seta{color:var(--orange);font-size:20px}
  .esp-row .antes b,.esp-row .depois b{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .esp-row .antes b{font-size:30px;color:#fff}
  .esp-row .depois b{font-size:46px;color:var(--orange);text-shadow:0 0 16px rgba(255,106,44,.45)}
  .stop{display:block;margin-top:2px;color:var(--green);font-size:20px;font-weight:800}
  .km-row{grid-template-columns:230px 188px minmax(0,1fr);padding:3px 0}
  .km-row b{font-family:Sora,sans-serif;font-size:42px;letter-spacing:-.03em;color:var(--orange);font-variant-numeric:tabular-nums}
  .km-row .code{font-size:36px}
  .bar{display:block;height:8px;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#1a6cff,var(--cyan));transform-origin:left center}
  .onde,.rede{display:grid;gap:12px;flex:1;min-height:0}
  .rede{grid-template-columns:1fr 1fr 1fr}
  .rede li{display:block;padding:10px 0}
  .rede .ln{display:block;font-family:Sora,sans-serif;font-size:28px}
  .rede .meta{display:block;margin-top:4px;color:#e8f2fc;font-size:18px;line-height:1.35;font-variant-numeric:normal}
  .onde.u{grid-template-columns:1.3fr 1fr .72fr}
  .onde.s{grid-template-columns:1fr 1fr 1fr}
  .onde.d{grid-template-columns:1fr 1fr}
  .zone h2{margin:0 0 6px;font-family:Sora,sans-serif;font-size:32px;letter-spacing:-.03em}
  .zone li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:22px;list-style:none}
  .zone ul{margin:0;padding:0}
  .zone .ln{font-family:Sora,sans-serif;font-size:26px}
  .zone li{align-items:flex-start;padding:3px 0}
  .zone .meta{color:#e8f2fc;font-variant-numeric:tabular-nums;font-size:20px;line-height:1.25;text-align:right}
  .nro{display:inline-block;min-width:2.2em;margin-right:8px;color:var(--cyan);font-family:Sora,sans-serif;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums}
  .zone .nro,.rede .nro{font-size:18px;vertical-align:3px}
  .esp-row .nro,.km-row .nro{font-size:16px;vertical-align:4px}
  .folha .nro{font-size:14px;min-width:2.4em;margin-right:6px;vertical-align:1px}
  .lista-topo,.zone .qtd{color:#d5e4f6;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .lista-topo{grid-column:1 / -1;padding:2px 0 6px}
  .lista-topo b,.zone .qtd b{font-family:Sora,sans-serif;font-size:28px;color:var(--orange);letter-spacing:-.03em;margin-right:6px;text-transform:none}
  .zone .qtd{display:block;margin:-2px 0 8px;font-size:16px}
  .zone .qtd b{font-size:26px}
  .folha.densa td,.folha.densa th{padding:7px 8px}
  .folha.densa td{font-size:18px}
  .folha.densa th{font-size:15px}
  .folha td.hot{color:var(--orange);font-weight:800}
  .folha tr.total td{font-weight:800;color:#fff;border-top:1px solid var(--line)}
  .callout{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-color:rgba(46,230,166,.45);background:linear-gradient(90deg,rgba(46,230,166,.14),rgba(8,18,36,.72))}
  .callout b{color:var(--green);font-family:Sora,sans-serif;font-size:30px}
  .banner{border-color:rgba(46,230,166,.4);color:#d8ffe4;font-size:20px;font-weight:700}
  .choice-slide{gap:12px}
  .choice-slide h1{font-size:clamp(36px,4vw,56px)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
  button.opt{display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:22px 28px}
  button.opt:hover{border-color:rgba(255,255,255,.55)}
  button.opt .stat-v{font-size:clamp(64px,6vw,104px)}
  button.opt.a{border-color:rgba(255,106,44,.55)}
  button.opt.b{border-color:rgba(61,225,255,.55)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
  .facts div{border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
  .facts b{display:block;font-family:Sora,sans-serif;font-size:clamp(22px,2vw,30px);letter-spacing:-.03em}
  .facts span{color:var(--muted);font-size:16px}
  .tag{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(46,230,166,.14);color:#d8ffe4;font-weight:800;font-size:18px}
  .soma-dia{gap:6px}
  .soma-dia h1{font-size:clamp(32px,3vw,44px);margin:0}
  .soma-dia .sheet-head{align-items:flex-end}
  .soma-dia .sheet-wrap{padding-bottom:12px}
  .soma-dia .folha td{padding:5px 6px}
  .sheet-slide h1{font-size:clamp(36px,3.4vw,52px)}
  .sheet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .pax-bases{display:flex;gap:22px;flex:none;align-items:flex-end}
  .pax-mes{flex:none;text-align:right}
  .pax-mes .stat-v{font-size:clamp(42px,4vw,68px);margin-top:2px}
  .sheet-head .lead{flex:1;min-width:0;margin:0 0 4px}
  .ajuste{flex:1;max-width:680px}
  .ajuste label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:#d5e4f6;font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .ajuste output{font-family:Sora,sans-serif;font-size:clamp(40px,4vw,64px);letter-spacing:-.04em;color:var(--orange);text-transform:none}
  .ajuste input[type=range]{width:100%;margin:6px 0 0;accent-color:#ff6a2c;height:26px;cursor:pointer}
  .trilho{position:relative;display:flex;height:16px;margin-top:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
  .trilho .piso{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:1}
  .trilho i{display:block;height:100%;width:0}
  .trilho i.seg-dom{background:var(--cyan)}
  .trilho i.seg-sab{background:var(--orange)}
  .trilho i.seg-util{background:var(--green)}
  .frase{margin:8px 0 0;color:#e8f2fc;font-size:20px;line-height:1.35}
  .pills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pills.pax{grid-template-columns:repeat(3,1fr)}
  .pills .glass{padding:10px 14px}
  .pills .stat-v{font-size:clamp(32px,2.8vw,48px);margin-top:2px}
  .pills .stat-s{margin-top:2px;font-size:18px}
  .sheet-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(6,12,28,.55);padding-bottom:52px;scroll-padding-bottom:56px}
  .folha{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .folha th{position:sticky;top:0;z-index:1;background:#0c1830;color:#d5e4f6;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  .folha td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:18px}
  .folha .num{text-align:right;font-family:Sora,sans-serif}
  .folha tr.in td{background:rgba(255,106,44,.13)}
  .folha tr.partial td{background:rgba(61,225,255,.18);font-weight:800}
  .folha tr.reforco td{background:rgba(46,230,166,.14)}
  .folha tr.out td{color:rgba(147,168,196,.42)}
  .folha tr.para td{background:rgba(255,106,44,.1)}
  .folha td.ln{font-family:Sora,sans-serif;font-weight:800;font-size:20px}
  .folha.soma th{font-size:13px;letter-spacing:.02em;line-height:1.15;padding:8px 6px;white-space:normal}
  .folha.soma td{font-size:17px;padding:6px 6px;white-space:nowrap}
  .folha.soma td.ln{font-size:18px}
  .folha td.dim{color:#e8f2fc;font-size:16px}
  .folha td.dom{color:var(--cyan);font-weight:800}
  .folha td.sab{color:var(--orange);font-weight:800}
  .folha td.util{color:var(--green);font-weight:800}
  .folha .prio{display:inline-block;margin-left:8px;min-width:1.6em;padding:1px 7px;border-radius:99px;background:rgba(46,230,166,.18);color:var(--green);font-family:Sora,sans-serif;font-size:15px;font-weight:800;letter-spacing:.02em;text-align:center;vertical-align:2px}
  .folha tr.out td.dom,.folha tr.out td.sab,.folha tr.out td.util{color:inherit;font-weight:700}
  .progress{position:relative;z-index:2;height:3px;background:rgba(255,255,255,.06)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--orange));box-shadow:0 0 10px rgba(61,225,255,.8)}
  .hint{position:fixed;left:22px;bottom:12px;z-index:3;color:var(--muted);font-size:12px}
  body.na-capa .hint,body.na-capa .nav-float,body.na-capa .ajuste-canto{visibility:hidden}
  .ajuste-canto{display:flex;align-items:center;gap:8px;width:228px;padding:4px 10px 4px 12px;border-radius:999px;border:1px solid rgba(140,210,255,.35);background:rgba(6,12,28,.72);box-shadow:0 0 14px rgba(61,225,255,.16)}
  .ajuste-canto label{display:flex;flex-direction:column;align-items:flex-start;gap:0;color:#d5e4f6;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1}
  .ajuste-canto output{font-family:Sora,sans-serif;font-size:18px;color:var(--orange);letter-spacing:-.03em;text-transform:none;text-shadow:0 0 12px rgba(255,106,44,.45)}
  .ajuste-canto input{flex:1;min-width:0;margin:0;accent-color:#ff6a2c;height:16px;cursor:pointer}
  .ajuste-canto input[hidden]{display:none}
  .hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#d5e6f8}
  .nav-float{position:fixed;right:18px;bottom:12px;z-index:3;display:flex;gap:8px}
  .nav-float button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(6,12,28,.72);color:#fff;font-size:18px;cursor:pointer}
  @media(max-width:1100px){
    body{overflow:auto}
    header{flex-wrap:wrap;height:auto}
    nav{display:none}
    .slide{height:auto;min-height:calc(100vh - 120px);padding:18px 16px 80px}

function totalSeq(){

}
function sequenciaKm(){
  const lista = [];
  const push = (dia, rows) => rows.forEach(r => {
    if (coletiva && dia === "util" && foraUtil.has(r.linha)) return;
    lista.push({ dia, linha:r.linha, periodo:r.periodo, mes:r.km * MULT[dia], viagensA:r.antes, viagensD:r.depois, corta:r.corta, espA:r.espA, espD:r.espD, kmDia:r.km });
  });
  push("dom", pacote.dom);
  push("sab", pacote.sab);
  const protegidas = new Set(prioridadeRetirar);
  const ordemAjuste = ordemUtil.filter(cod => !protegidas.has(cod)).concat(prioridadeRetirar.slice().reverse());
  push("util", ordemAjuste.map(cod => pacote.util.find(r => r.linha === cod)).filter(Boolean));
  let acc = 0, accV = 0;
  return lista.map(item => {
    const antes = acc;
    acc += item.mes;
    const vMes = item.corta * DIAS_ANO[item.dia] / 12;
    accV += vMes;
    return { ...item, antes, acum:acc, vMes, vAcum:accV };
  });

function classificar(item, alvo){
  if (item.mes < 0) return item.antes < alvo - 0.001 ? { estado:"reforco", entra:item.mes } : { estado:"out", entra:0 };
  if (item.antes >= alvo - 0.001) return { estado:"out", entra:0 };
  if (item.acum <= alvo + 0.001) return { estado:"in", entra:item.mes };
  return { estado:"partial", entra:alvo - item.antes };
}
function textoAjuste(rows, alvo){
  const ativos = rows.filter(r => r.estado === "in" || r.estado === "partial");
  if (!ativos.length) return "Nada sai neste total. O controle sobe até 70.000 km no mês, na ordem da planilha: domingo, sábado e dia útil.";
  const kmDia = dia => rows.filter(r => r.dia === dia && r.estado !== "out").reduce((s,r) => s + r.entra, 0);
  const pedacos = [];
  if (kmDia("dom") > 0.5) pedacos.push(`${fmt(kmDia("dom"), 0)} km no domingo`);
  if (kmDia("sab") > 0.5) pedacos.push(`${fmt(kmDia("sab"), 0)} km no sábado`);
  if (kmDia("util") > 0.5) pedacos.push(`${fmt(kmDia("util"), 0)} km no dia útil`);
  const lista = pedacos.join(", ").replace(/, ([^,]*)$/, " e $1");
  const ordem = prioridadeRetirar.filter(cod => rows.some(r => r.dia === "util" && r.linha === cod)).map(cod => cod === "110/111" ? "110 e 111" : cod);
  const aviso = ordem.length ? ` Se o total descer, saem primeiro da redução: ${ordem.join(", ").replace(/, ([^,]*)$/, " e $1")}.` : "";
  const cheia = Math.abs(alvo - totalSeq()) < 0.6;
  if (cheia) return `Saem ${lista}. A soma fecha no total da proposta.${aviso}`;
  const borda = ativos[ativos.length - 1];
  const nota = borda.dia === "util" && prioridadeNota[borda.linha] ? ` Prioridade ${prioridadeNota[borda.linha]} para sair da redução.` : "";
  const onde = borda.estado === "partial"
    ? `A soma passa de ${fmt(alvo, 0)} km na linha ${borda.linha} (${tipoNome[borda.dia].toLowerCase()}): entram ${fmt(borda.entra, 0)} km dos ${fmt(borda.mes, 0)} dessa linha.${nota}`
    : `A soma fecha na linha ${borda.linha} (${tipoNome[borda.dia].toLowerCase()}).${nota}`;
  return `Saem ${lista}. ${onde}`;
}

    return `<section class="slide"><div class="reveal"><div class="kicker">07</div><h1>Saldo.</h1>${comNota("")}</div>

      <article class="glass reveal"><div class="stat-k">1 dia</div><div class="stat-v orange" data-count="${dia.total}" data-dec="2">0</div><div class="stat-s">km · ${fmt(u.corteV)} úteis · ${fmt(s.corteV)} sábados · ${fmt(d.corteV)} domingos</div></article>
      <article class="glass reveal"><div class="stat-k">Mês</div><div class="stat-v cyan" data-count="${mes.total}" data-dec="2">0</div><div class="stat-s">km · ${fmtKm(mes.util)} úteis · ${fmtKm(mes.sab)} sábados · ${fmtKm(mes.dom)} domingos</div></article>
    </div>
    <article class="glass chart-slim reveal"><div class="stat-k">Km no mês, por tipo de dia</div><canvas id="chartSaldo"></canvas></article>
  </section>`;
  },
  () => {
    const rows = paxLista();
    const itens = numerar(rows, r => r[0]);
    const qtd = itens.reduce((s, x) => s + x.peso, 0);
    const body = itens.map(({ r, nro }) => {
      const [linha, pct, carro, pass, km, ipk, atu, prop, obs] = r;
      return `<tr class="${r.parcial ? "partial" : ""}"><td class="ln"><span class="nro">${nro}</span>${linha}</td><td class="num${pct < 1 ? " hot" : ""}">${fmt(pct, 2)}%</td><td class="num">${fmtFlex(carro)}</td><td class="num">${fmt(pass)}</td><td class="num">${fmtFlex(km)}</td><td class="num">${fmt(ipk, 2)}</td><td class="num">${atu}</td><td class="num">${prop}</td><td class="dim">${obs}</td></tr>`;
    }).join("");
    const tot = rows.reduce((s, r) => ({ pct:s.pct + r[1], carro:s.carro + r[2], pass:s.pass + r[3], atu:s.atu + r[6], prop:s.prop + r[7] }), { pct:0, carro:0, pass:0, atu:0, prop:0 });
    const pctBase = Math.round(tot.pass / BASE_ENTREPICO * 10000) / 100;
    return `<section class="slide sheet-slide">
      <div class="sheet-head">
        <div><div class="kicker">Dia útil · 29/09/2026</div><h1>Passageiros<br><em>catracados.</em></h1></div>
        ${comNota(`<b>${qtd}</b> ${qtd === 1 ? "linha" : "linhas"}. Cada percentual é a linha sobre a base do entrepico.`)}
        <div class="pax-mes reveal"><div class="stat-k">Dia útil</div><div class="stat-v orange" data-count="${BASE_ENTREPICO}">0</div><div class="stat-s">base do entrepico · ${fmt(tot.pass)} afetados · ${fmt(pctBase, 2)}%</div></div>
      </div>
      <div class="sheet-wrap">
        <table class="folha densa">
          <thead><tr><th>Linha</th><th class="num">%</th><th class="num">Pass./carro</th><th class="num">Passageiros</th><th class="num">Km</th><th class="num">IPK</th><th class="num">Carros</th><th class="num">Proposta</th><th>Obs</th></tr></thead>
          <tbody>${body}<tr class="total"><td>Total</td><td class="num">${fmt(pctBase, 2)}%</td><td class="num">${fmtFlex(tot.carro)}</td><td class="num">${fmt(tot.pass)}</td><td></td><td></td><td class="num">${tot.atu}</td><td class="num">${tot.prop}</td><td>de ${fmt(BASE_ENTREPICO)} no entrepico</td></tr></tbody>
        </table>
      </div>
    </section>`;
  }
];

function killCharts(){ charts.splice(0).forEach(c => c.destroy()); }
function animateIn(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    if (reduce || arrastando){ el.textContent = fmt(end, dec) + suffix; return; }
  });
  if (reduce || arrastando){
    root.querySelectorAll(".reveal").forEach(el => { el.style.opacity = "1"; el.style.visibility = "visible"; });
    return;
  }
  slideTween = gsap.timeline({ defaults:{ ease:"power3.out" } });
  slideTween.from(root.querySelectorAll(".reveal"), { y:24, autoAlpha:0, duration:.62, stagger:{ each:.045, from:"start" } }, 0);
  slideTween.from(root.querySelectorAll(".bar"), { scaleX:0, duration:.7, stagger:.025, ease:"power2.out" }, .18);
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    const obj = { v:0 };
    slideTween.to(obj, { v:end, duration:.9, ease:"power2.out", onUpdate(){ el.textContent = fmt(obj.v, dec) + suffix; } }, .05);
  });
}
function drawCharts(){
  const u = diaVista("util"), s = diaVista("sab"), d = diaVista("dom");
  if (document.getElementById("chartViagens")) slim("chartViagens", ["Dias úteis","Sábados","Domingos"], [{ label:"Viagens", data:[u.corteV, s.corteV, d.corteV], color:"rgba(255,106,44,.9)" }]);
  const mes = totaisMes();
  if (document.getElementById("chartSaldo")) slim("chartSaldo", ["Dias úteis","Sábados","Domingos"], [{ label:"Km no mês", data:[mes.util, mes.sab, mes.dom], color:"rgba(255,106,44,.92)" }]);
}
function render(){
  cenaCache = null;
  killCharts();
  if (slideTween) slideTween.kill();
  app.innerHTML = slides[page]();
  const cena = cenario();
  const vivo = document.getElementById("ajusteVivo");
  vivo.hidden = true;
  document.body.classList.toggle("na-capa", page === 0);
  pintarKmBar();
  pager.textContent = String(page+1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");
  gsap.to(bar, { width:((page+1)/slides.length*100)+"%", duration: reduce ? 0 : .4, ease:"power2.out" });
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", page >= Number(b.dataset.go) && page <= Number(b.dataset.end)));
  drawCharts();
  animateIn(app);
  ligarFolha();
}
function go(n){
  const next = Math.max(0, Math.min(slides.length-1, n));
  if (next === page) return;
  const current = app.querySelector(".slide");
  if (!current || reduce){ page = next; render(); return; }
  gsap.to(current, { autoAlpha:0, y:-10, duration:.2, ease:"power2.in", onComplete(){ page = next; render(); } });
}
document.querySelector("#nav").innerHTML = navItems.map(([label,i], idx) => {
  const end = navItems[idx+1] ? navItems[idx+1][1]-1 : slides.length-1;
  return `<button data-go="${i}" data-end="${end}">${label}</button>`;
}).join("");
document.querySelector("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(Number(b.dataset.go)); });
document.querySelector("#prev").onclick = () => go(page-1);
document.querySelector("#next").onclick = () => go(page+1);
function alternarTelaCheia(){
  const ativo = document.fullscreenElement || document.webkitFullscreenElement;
  if (!ativo){
    const pedir = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    if (pedir) pedir.call(document.documentElement);
  } else {
    const sair = document.exitFullscreen || document.webkitExitFullscreen;
    if (sair) sair.call(document);
  }
}
document.addEventListener("keydown", e => {
  if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); alternarTelaCheia(); return; }
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); go(page+1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(page-1); }
});
if (!reduce){
  gsap.to(".orb-a", { x:40, y:24, duration:9, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.to(".orb-b", { x:-30, y:-20, duration:11, yoyo:true, repeat:-1, ease:"sine.inOut" });
}
ligarAjusteCanto();
render();
</script>
</body>
</html>
