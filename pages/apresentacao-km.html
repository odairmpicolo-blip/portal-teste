  .callout{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:rgba(46,230,166,.4);background:linear-gradient(90deg,rgba(46,230,166,.14),rgba(8,18,36,.7))}

  .hint{position:fixed;left:28px;bottom:14px;z-index:3;color:var(--muted);font-size:12px}
  .hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#d5e6f8}
  .nav-float{position:fixed;right:24px;bottom:16px;z-index:3;display:flex;gap:8px}
  .nav-float button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(6,12,28,.72);color:#fff;font-size:18px;cursor:pointer}

    body{overflow:auto}

    .hero,.split,.pair,.compare,.fleet,.fronts,.cols,.kpi-row,.where{grid-template-columns:1fr}
    .chart-box{height:320px}
    .arrow{transform:rotate(90deg)}
    nav{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    .scan,.orb{display:none}
  }
</style>

function fmt(n, dec){
  return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}
function km(n){ return fmt(n, 2).replace(",00","") + " km"; }

function chartBase(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:"circle" } } },
    scales:{
      x:{ grid:{ color:"rgba(255,255,255,.06)" }, border:{ display:false } },
      y:{ grid:{ color:"rgba(255,255,255,.06)" }, border:{ display:false }, ticks:{ callback:v => fmt(v) } }
    }
  };
}
const calendario = { "Dias úteis":253, "Sábados":59, "Domingos":53 };
const shareTrips = trips.map(r => ({ dia:r.dia, valor:Math.round(calendario[r.dia] * (r.antes - r.depois) / 12) }));
const shareKm = kms.map(r => ({ dia:r.dia, valor:Math.round(calendario[r.dia] * r.diaKm / 12) }));

function shareChart(id, rows, total){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const colors = ["rgba(61,225,255,.92)","rgba(255,106,44,.92)","rgba(255,77,94,.92)"];
  charts.push(new Chart(ctx, {
    type:"bar",
    data:{
      labels: rows.map(r => r.dia),
      datasets:[{
        data: rows.map(r => r.valor),
        backgroundColor: colors,
        borderRadius: 12,
        maxBarThickness: 72
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      layout:{ padding:{ top:8 } },
      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{ label:c => fmt(c.parsed.y) + " · " + fmt(c.parsed.y / total * 100, 1) + "%" } }
      },
      scales:{
        x:{ grid:{ display:false }, border:{ display:false } },
        y:{ grace:"32%", grid:{ color:"rgba(255,255,255,.06)" }, border:{ display:false }, ticks:{ callback:v => fmt(v) } }
      }
    },
    plugins:[{
      id:"shareValue",
      afterDatasetsDraw(chart){
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((bar, i) => {
          const val = chart.data.datasets[0].data[i];
          const pct = fmt(val / total * 100, 1) + "%";
          const top = bar.y;
          ctx.save();
          ctx.textAlign = "center";
          ctx.fillStyle = "#f3f7ff";
          ctx.font = "800 22px Sora, sans-serif";
          ctx.fillText(fmt(val), bar.x, top - 34);
          ctx.fillStyle = "#c5d4e8";
          ctx.font = "700 16px Outfit, sans-serif";
          ctx.fillText(pct, bar.x, top - 14);
          ctx.restore();
        });
      }
    }]
  }));
}
function grouped(id, rows, labelA, labelB){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts.push(new Chart(ctx, {
    type:"bar",
    data:{
      labels: rows.map(r => r.dia),
      datasets:[
        { label:labelA, data:rows.map(r => r.antes), backgroundColor:"rgba(61,225,255,.85)", borderRadius:8, maxBarThickness:42 },
        { label:labelB, data:rows.map(r => r.depois), backgroundColor:"rgba(255,106,44,.9)", borderRadius:8, maxBarThickness:42 }
      ]
    },
    options:Object.assign(chartBase(), {
      plugins:{
        legend: chartBase().plugins.legend,
        tooltip:{ callbacks:{ label:c => c.dataset.label + ": " + fmt(c.parsed.y) } }
      }
    })
  }));
}

function rankRows(day){
  return lines[day]
    .filter(r => r[3] > 0)
    .slice()
    .sort((a,b) => b[3] - a[3]);
}
function rankHtml(day){
  const rows = rankRows(day);
  const max = Math.max(...rows.map(r => r[3]));
  return `<div class="cols">${rows.map(r => {
    const gone = r[2] === 0;
    return `<div class="rank-row ${gone ? "zero" : ""}">
      <span class="code">${r[0]}</span>
      <div class="track"><i class="bar-fill" style="--w:${(r[3] / max * 100).toFixed(1)}%"></i></div>
      <span class="num">↓ ${r[3]}</span>
      <span class="km">${fmt(r[4], 2)} km</span>
    </div>`;
  }).join("")}</div>`;

function zonaHtml(zona, peak){
  const linhas = zona.linhas.map(r => {
    const espera = r[1] == null ? "sem horário" : `${r[1]} → ${r[2]} min`;
    return `<div class="zrow"><span class="code">${r[0]}</span><span class="wait">${espera}</span><span class="cut">↓ ${r[3]}</span></div>`;
  }).join("");
  return `<article class="glass zone ${peak ? "peak" : ""} reveal">
    <div class="zone-head"><span>${zona.nome}</span><div><b>${zona.viagens}</b><small>viagens</small></div></div>
    ${linhas}
  </article>`;
}
function ondeReduz(){
  return `<div class="where">
    ${zonaHtml(ondeUtil[0], true)}
    ${zonaHtml(ondeUtil[1], false)}
    <div class="where-stack">${zonaHtml(ondeUtil[2], false)}${zonaHtml(ondeUtil[3], false)}</div>
  </div>`;
}
function lineSlide(day, kicker, sub, tripsDay, kmDay, sunday){
  const extra = sunday ? `<article class="glass callout reveal"><div><div class="stat-k">Alternativa de atendimento</div><div class="stat-s">A linha 417 passa de 13 para 71 viagens.</div></div><b>+58 viagens · +372,66 km</b></article>` : "";
  return `<section class="slide">
    <div class="rank-head">
      <div class="reveal"><div class="kicker">${kicker}</div><h1 style="font-size:clamp(32px,3.4vw,48px)">Redução por linha.</h1><p class="lead" style="margin-top:4px">${sub}. Barras na escala da maior redução do dia.</p></div>
      <div class="rank-kpis">
        <article class="glass reveal"><div class="stat-k">Viagens / dia</div><b>↓ ${fmt(tripsDay)}</b></article>
        <article class="glass reveal"><div class="stat-k">Km / dia</div><b>↓ ${kmDay}</b></article>
      </div>
    </div>
    ${extra}
    ${rankHtml(day)}
  </section>`;
}

function killCharts(){ charts.splice(0).forEach(c => c.destroy()); }

function animateIn(root){
  if (reduce) return;
  slideTween = gsap.timeline({ defaults:{ ease:"power3.out" } });
  slideTween.from(root.querySelectorAll(".reveal"), {
    y:18, autoAlpha:0, duration:.55, stagger:.045
  }, 0);
  slideTween.from(root.querySelectorAll(".bar-fill"), {
    scaleX:0, duration:.7, stagger:.02, ease:"power3.out"
  }, .12);
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    const obj = { v:0 };
    slideTween.to(obj, {
      v:end, duration:1.05, ease:"power2.out",
      onUpdate(){ el.textContent = fmt(obj.v, dec) + suffix; }
    }, .08);
  });
}

function render(){
  killCharts();
  if (slideTween) slideTween.kill();
  app.innerHTML = slides[page]();
  pager.textContent = String(page + 1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");
  gsap.to(bar, { width: ((page + 1) / slides.length * 100) + "%", duration: reduce ? 0 : .45, ease:"power2.out" });
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", Number(b.dataset.go) === page || (b.dataset.span && page >= Number(b.dataset.go) && page <= Number(b.dataset.end))));
  if (page === 2) grouped("chartTrips", trips, "Programação original", "Nova programação");
  if (page === 3) grouped("chartWait", espera, "Espera atual", "Nova espera");
  if (page === 5) grouped("chartKm", kms, "Cenário atual", "Após a redução");
  if (page === 11){ shareChart("chartShareTrips", shareTrips, 11618); shareChart("chartShareKm", shareKm, 112971); }
  animateIn(app);
}

function go(n){
  const next = Math.max(0, Math.min(slides.length - 1, n));
  if (next === page) return;
  const current = app.querySelector(".slide");
  if (!current || reduce){ page = next; render(); return; }
  gsap.to(current, { autoAlpha:0, y:-12, duration:.22, ease:"power2.in", onComplete(){ page = next; render(); } });
}

document.querySelector("#nav").innerHTML = navItems.map(([label, i], idx) => {
  const end = navItems[idx + 1] ? navItems[idx + 1][1] - 1 : slides.length - 1;
  return `<button data-go="${i}" data-end="${end}" data-span="1">${label}</button>`;
}).join("");
document.querySelector("#nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) go(Number(b.dataset.go));
});
document.querySelector("#prev").onclick = () => go(page - 1);
document.querySelector("#next").onclick = () => go(page + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); go(page + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(page - 1); }
  if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});

if (!reduce){
  gsap.to(".orb-a", { x:50, y:30, duration:9, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.to(".orb-b", { x:-40, y:-24, duration:11, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.to(".orb-c", { x:-30, y:20, duration:7, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.fromTo(".scan", { y:"-20vh" }, { y:"120vh", duration:7.5, repeat:-1, ease:"none" });
}
render();
</script>
