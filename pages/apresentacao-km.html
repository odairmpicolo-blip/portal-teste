<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apresentação KM | Portal CIOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@420;560;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#030814; --ink:#f3f7ff; --muted:#93a8c4; --line:rgba(120,190,255,.18);
    --cyan:#3de1ff; --orange:#ff6a2c; --green:#2ee6a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif}
  body{overflow:hidden}
  .stage{position:relative;height:100%;display:flex;flex-direction:column}
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .sky .grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(61,225,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(61,225,255,.07) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 72%);opacity:.55}
  .orb{position:absolute;border-radius:50%;filter:blur(18px);opacity:.7}
  .orb-a{width:420px;height:420px;left:-80px;top:-90px;background:radial-gradient(circle,#1d6dff 0%,transparent 68%)}
  .orb-b{width:380px;height:380px;right:-60px;bottom:-80px;background:radial-gradient(circle,#ff4d2a 0%,transparent 70%)}
  header{position:relative;z-index:2;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(6,12,28,.82),rgba(6,12,28,.4));backdrop-filter:blur(16px)}
  .brand{display:flex;align-items:center;gap:10px;min-width:180px}
  .brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
  .brand strong{display:block;font-family:Sora,sans-serif;letter-spacing:.12em;font-size:13px}
  .brand small{color:var(--muted);letter-spacing:.14em;font-size:10px}
  .cenarios{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .cenarios button{border:0;background:transparent;color:var(--muted);font:800 15px/1 Outfit,sans-serif;letter-spacing:.04em;padding:12px 16px;border-radius:999px;cursor:pointer}
  .cenarios button.on{color:#1a0a04;background:var(--orange)}
  .cenarios button[data-cenario="2"].on{color:#041018;background:var(--cyan)}
  nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  nav button{font:700 12px/1 Outfit,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 10px;cursor:pointer}
  nav button.on,nav button:hover{color:#fff;border-color:var(--line);background:rgba(61,225,255,.1)}
  .count{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:800;letter-spacing:.12em;font-size:13px}
  .portal-back{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
  .portal-back:hover{color:#fff}
  main{position:relative;z-index:1;flex:1;min-height:0}
  .slide{height:100%;padding:22px 36px 16px;display:flex;flex-direction:column;gap:14px}
  .kicker{color:var(--cyan);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
  h1{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.96;margin:6px 0 0;font-size:clamp(40px,4.4vw,64px)}
  h1 em{font-style:normal;color:var(--cyan)}
  .lead{max-width:920px;color:var(--muted);font-size:20px;line-height:1.35;margin:8px 0 0}
  .glass{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(18,34,68,.78),rgba(6,12,28,.72));box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);padding:16px 18px}
  .glass:before{content:"";position:absolute;inset:0 auto auto 0;width:120px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
  .pick{border-color:rgba(61,225,255,.7);box-shadow:0 0 0 1px rgba(61,225,255,.35),0 18px 40px rgba(0,0,0,.28)}
  .pick.a{border-color:rgba(255,106,44,.75);box-shadow:0 0 0 1px rgba(255,106,44,.35),0 18px 40px rgba(0,0,0,.28)}
  .stat-k{color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
  .stat-v{font-family:Sora,sans-serif;font-size:clamp(48px,4.6vw,76px);letter-spacing:-.04em;line-height:.92;margin-top:6px}
  .stat-v.orange{color:var(--orange)} .stat-v.cyan{color:var(--cyan)} .stat-v.green{color:var(--green)}
  .stat-s{color:#d5e6f8;margin-top:8px;font-size:18px;line-height:1.3}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
  .quad .glass{display:flex;flex-direction:column;justify-content:center;padding:22px 28px}
  .quad .stat-v{font-size:clamp(64px,6.2vw,108px)}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1}
  .kpi-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1}
  .kpi-row .glass,.kpi-3 .glass{display:flex;flex-direction:column;justify-content:center}
  .kpi-3 .stat-v{font-size:clamp(72px,7.4vw,120px)}
  .kpi-row .stat-v{font-size:clamp(42px,3.6vw,64px)}
  .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
  .tres .glass,.pair-big .glass{display:flex;flex-direction:column;justify-content:center}
  .pair-big{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
  .pair-big .stat-v{font-size:clamp(56px,5.4vw,92px)}
  .fronts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fronts p{margin:8px 0 0;color:#d5e6f8;font-size:20px;line-height:1.35}
  .chart-slim{height:200px;flex:none;padding:12px 14px 8px;display:flex;flex-direction:column}
  .chart-slim canvas{width:100%!important;flex:1;min-height:0}
  .chart-slim .stat-k{margin-bottom:4px}
  .esp-list,.km-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 32px;align-content:start;flex:1;min-height:0}
  .esp-row,.km-row{display:grid;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .esp-row{grid-template-columns:92px 1fr auto}
  .esp-row .code,.km-row .code{font-family:Sora,sans-serif;font-size:28px}
  .esp-row .mins{font-size:22px;color:#d5e6f8;font-variant-numeric:tabular-nums}
  .esp-row .plus{font-family:Sora,sans-serif;font-size:34px;color:var(--orange);font-variant-numeric:tabular-nums}
  .km-row{grid-template-columns:220px 140px minmax(0,1fr);padding:5px 0}
  .km-row b{font-family:Sora,sans-serif;font-size:48px;letter-spacing:-.03em;color:var(--orange);font-variant-numeric:tabular-nums}
  .km-row .code{font-size:36px}
  .bar{display:block;height:8px;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#1a6cff,var(--cyan));transform-origin:left center}
  .stop{color:var(--green);font-size:22px;font-weight:800}
  .onde{display:grid;gap:12px;flex:1;min-height:0}
  .onde.u{grid-template-columns:1.3fr 1fr .72fr}
  .onde.s{grid-template-columns:1fr 1fr 1fr}
  .onde.d{grid-template-columns:1fr 1fr}
  .zone h2{margin:0 0 6px;font-family:Sora,sans-serif;font-size:28px;letter-spacing:-.03em}
  .zone li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:22px;list-style:none}
  .zone ul{margin:0;padding:0}
  .zone .ln{font-family:Sora,sans-serif;font-size:24px}
  .zone .meta{color:#d5e6f8;font-variant-numeric:tabular-nums;font-size:18px}
  .callout{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:rgba(46,230,166,.45);background:linear-gradient(90deg,rgba(46,230,166,.14),rgba(8,18,36,.72))}
  .callout b{color:var(--green);font-family:Sora,sans-serif;font-size:36px}
  .banner{border-color:rgba(46,230,166,.4);color:#d8ffe4;font-size:20px;font-weight:700}
  .choice-slide{gap:12px}
  .choice-slide h1{font-size:clamp(36px,4vw,56px)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
  button.opt{display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:22px 28px}
  button.opt:hover{border-color:rgba(255,255,255,.55)}
  button.opt .stat-v{font-size:clamp(64px,6vw,104px)}
  button.opt.a{border-color:rgba(255,106,44,.55)}
  button.opt.b{border-color:rgba(61,225,255,.55)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
  .facts div{border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
  .facts b{display:block;font-family:Sora,sans-serif;font-size:clamp(22px,2vw,30px);letter-spacing:-.03em}
  .facts span{color:var(--muted);font-size:16px}
  .tag{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(46,230,166,.14);color:#d8ffe4;font-weight:800;font-size:18px}
  .progress{position:relative;z-index:2;height:3px;background:rgba(255,255,255,.06)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--orange))}
  .hint{position:fixed;left:22px;bottom:12px;z-index:3;color:var(--muted);font-size:12px}
  .hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#d5e6f8}
  .nav-float{position:fixed;right:18px;bottom:12px;z-index:3;display:flex;gap:8px}
  .nav-float button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(6,12,28,.72);color:#fff;font-size:18px;cursor:pointer}
  @media(max-width:1100px){
    body{overflow:auto}
    header{flex-wrap:wrap;height:auto}
    nav{display:none}
    .slide{height:auto;min-height:calc(100vh - 120px);padding:18px 16px 80px}
    .quad,.kpi-row,.kpi-3,.tres,.pair-big,.fronts,.esp-list,.km-list,.onde.u,.onde.s,.onde.d,.choice,.facts{grid-template-columns:1fr}
    .chart-slim{height:220px}
  }
  @media(prefers-reduced-motion:reduce){ .orb{display:none} }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="grid"></div><div class="orb orb-a"></div><div class="orb orb-b"></div></div>
<div class="stage">
  <header>
    <div class="brand">
      <img src="../assets/img/LOGO_TCGL.png" alt="TCGL">
      <div><strong>TCGL</strong><small>REDUÇÃO 2026</small></div>
    </div>
    <div class="cenarios" id="cenarios">
      <button type="button" data-cenario="1" class="on">1 · Total</button>
      <button type="button" data-cenario="2">2 · Parcial</button>
    </div>
    <nav id="nav"></nav>
    <div style="display:flex;align-items:center;gap:12px">
      <a class="portal-back" href="../index.html">Portal</a>
      <div class="count" id="pager">01</div>
    </div>
  </header>
  <main id="app"></main>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</div>
<div class="hint"><kbd>←</kbd> <kbd>→</kbd> navegar · os cenários ficam no topo</div>
<div class="nav-float">
  <button id="prev" aria-label="Anterior">←</button>
  <button id="next" aria-label="Próximo">→</button>
</div>
<script>
const reserva = new Set(["110/111","803","404","306","106","303","501","311","405","101","351"]);
const progMes = 1419544;
const redMes = { 1:112971, 2:85567 };
const reservaMes = 27404;
const ano = { 1:1355647, 2:1026804 };
const viagensMes = { antes:158838, 1:147220, corte1:11618, corte2:8350 };
const diasBase = {
  util:{ nome:"Dias úteis", viagensA:5988, viagensD:5635, corteV:353, kmA:54700, km:3487, espA:19, espD:32, extra:13, frota:26 },
  sab:{ nome:"Sábados", viagensA:3940, viagensD:3477, corteV:463, kmA:33060, km:5003, espA:32, espD:59, extra:27, frota:19 },
  dom:{ nome:"Domingos", viagensA:2993, viagensD:2563, corteV:430, kmA:23489, km:3363, espA:37, espD:80, extra:43, frota:15 }
};
const linhas = {
  util:[
    ["101","Noite",78,71,58.32,30,60],["106","Entrepico",162,148,116.16,12,15],["107","Entrepico e noite",77,33,314.31,null,null],
    ["110/111","Entrepico",173,151,207.15,23,35],["112","Entrepico",108,94,116.98,22,32],["113","Entrepico",162,135,277.85,12,15],
    ["303","Entrepico",73,64,112.25,30,45],["306","Entrepico",70,50,126.61,22,44],["311","Entrepico",158,146,107.7,14,18],
    ["351","Entrepico e tarde",68,58,33.5,null,null],["404","Entrepico",99,79,132.44,22,43],["405","Entrepico",115,104,107.31,12,25],
    ["420","Entrepico e noite",126,97,284.49,17,35],["501","Entrepico e noite",160,145,108.29,15,20],["800","Entrepico",45,32,197.28,null,null],
    ["802","Entrepico",44,32,141.35,null,null],["803","Entrepico e noite",137,122,190.11,18,22],["806","Entrepico e noite",35,22,194.73,null,null],
    ["900","Entrepico e noite",55,25,427.55,null,null],["913","Entrepico",41,25,229.65,null,null]
  ],
  sab:[
    ["102","Após as 14h",85,67,80.65,20,40],["104","Após as 14h",85,67,94.86,20,40],["107","Dia todo",58,0,433.78,null,null],
    ["112","Após as 14h",73,60,109.19,31,40],["113","Após as 14h",74,60,146.78,30,40],["301","Após as 18h",53,47,30.39,50,90],
    ["302","Após as 18h",60,51,45.07,45,90],["303","Após as 18h",69,60,112.25,40,80],["310","Dia todo",30,0,221.24,null,null],
    ["400","Após as 18h",70,58,25.38,32,64],["402","Após as 18h",72,62,33.76,32,64],["420","Após as 14h",65,48,165.44,35,70],
    ["426","Após as 18h",72,62,31.63,32,64],["800","Dia todo",4,0,63.13,null,null],["803","Dia todo",102,47,708.74,17,29],
    ["804","Dia todo",32,0,429.33,null,null],["806","Dia todo",45,0,710.95,null,null],["900","Dia todo",62,0,928.52,null,null],
    ["913","Dia todo",41,0,632.06,null,null]
  ],
  dom:[
    ["102","Dia todo",56,28,131.88,40,80],["104","Dia todo",56,28,148.69,40,80],["107","Dia todo",46,0,339.69,null,null],
    ["301","Dia todo",46,28,91.16,50,90],["302","Dia todo",56,27,156.62,40,90],["303","Dia todo",58,29,364.81,40,80],
    ["400","Dia todo",66,32,53.44,34,85],["402","Dia todo",47,23,47.26,34,85],["413","Dia todo",68,36,119.27,34,68],
    ["417","Dia todo",13,71,-372.66,null,null],["420","Dia todo",75,35,394.85,30,65],["423","Dia todo",70,40,138.99,34,68],
    ["425","Dia todo",50,0,568.74,null,null],["426","Dia todo",45,29,56.61,34,85],["803","Dia todo",38,0,586.07,null,null],
    ["900","Dia todo",46,0,688.14,null,null]
  ]
};
function row(r){ return { linha:r[0], periodo:r[1], antes:r[2], depois:r[3], km:r[4], espA:r[5], espD:r[6], corta:r[2]-r[3] }; }
const pacote = { util:linhas.util.map(row), sab:linhas.sab.map(row), dom:linhas.dom.map(row) };

let cenario = 1;
let page = 0;
let slideTween = null;
let charts = [];
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = document.querySelector("#app");
const pager = document.querySelector("#pager");
const bar = document.querySelector("#bar");
Chart.defaults.color = "#9fb0c8";
Chart.defaults.font.family = "Outfit, sans-serif";
Chart.defaults.font.size = 14;
Chart.defaults.animation.duration = reduce ? 0 : 700;

function fmt(n, dec){ return Number(n).toLocaleString("pt-BR", { minimumFractionDigits:dec||0, maximumFractionDigits:dec||0 }); }
function entra(dia, linha){ return !(cenario === 2 && dia === "util" && reserva.has(linha)); }
function nomeCenario(){ return cenario === 1 ? "Cenário total" : "Cenário parcial"; }
function redAtual(){ return redMes[cenario]; }
function ficaAtual(){ return progMes - redAtual(); }
function corteViagens(){ return cenario === 1 ? viagensMes.corte1 : viagensMes.corte2; }
function viagensDepois(){ return viagensMes.antes - corteViagens(); }
function diaVista(id){
  const d = diasBase[id];
  if (id === "util" && cenario === 2) return Object.assign({}, d, { corteV:198, km:2187, viagensD:5790 });
  return d;
}
function cortes(dia){ return pacote[dia].filter(r => r.corta > 0 && entra(dia, r.linha)); }
function mediaUtil(){
  const rows = pacote.util.filter(r => r.espA != null && r.corta > 0 && entra("util", r.linha));
  if (rows.length === 13) return { antes:19, depois:32, extra:13 };
  const a = Math.round(rows.reduce((s,r)=>s+r.espA,0) / rows.length);
  const d = Math.round(rows.reduce((s,r)=>s+r.espD,0) / rows.length);
  return { antes:a, depois:d, extra:d - a };
}

function num(k, v, s, cls){
  return `<article class="glass reveal"><div class="stat-k">${k}</div><div class="stat-v ${cls||""}" data-count="${v}">0</div>${s ? `<div class="stat-s">${s}</div>` : ""}</article>`;
}
function espHtml(dia){
  const rows = cortes(dia).filter(r => r.espA != null).sort((a,b) => (b.espD-b.espA) - (a.espD-a.espA));
  return `<div class="esp-list">${rows.map(r => `<div class="esp-row reveal"><span class="code">${r.linha}</span><span class="mins">${r.espA} → ${r.espD} min</span><span class="plus">+${r.espD - r.espA}</span></div>`).join("")}</div>`;
}
function paraHtml(dia){
  const rows = cortes(dia).filter(r => r.espA == null);
  return `<div class="esp-list">${rows.map(r => `<div class="esp-row reveal"><span class="code">${r.linha}</span><span class="mins">${r.periodo}</span><span class="stop">sem horário</span></div>`).join("")}</div>`;
}
function kmHtml(dia){
  const rows = cortes(dia).slice().sort((a,b) => b.km - a.km);
  const max = Math.max(...rows.map(r => r.km));
  return `<div class="km-list">${rows.map(r => `<div class="km-row reveal"><b>${fmt(r.km)} km</b><span class="code">${r.linha}</span><i class="bar" style="--w:${(r.km / max * 100).toFixed(1)}%"></i></div>`).join("")}</div>`;
}
function ondeHtml(dia, periodos, cls){
  const blocos = periodos.map(p => {
    const rows = cortes(dia).filter(r => r.periodo === p).sort((a,b) => b.corta - a.corta);
    const itens = rows.map(r => {
      const espera = r.espA == null ? "sem horário" : `${r.espA} → ${r.espD} min`;
      return `<li><span class="ln">${r.linha}</span><span class="meta">↓ ${r.corta} · ${espera}</span></li>`;
    }).join("");
    return `<article class="glass zone reveal"><h2>${p}</h2><ul>${itens}</ul></article>`;
  }).join("");
  return `<div class="onde ${cls}">${blocos}</div>`;
}
function slim(id, labels, series){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts.push(new Chart(ctx, {
    type:"bar",
    data:{
      labels,
      datasets: series.map(s => ({
        label:s.label, data:s.data, backgroundColor:s.color, borderRadius:8, maxBarThickness:36
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:series.length > 1, labels:{ boxWidth:10, boxHeight:10, usePointStyle:true, font:{ size:14, weight:"700" } } } },
      scales:{
        x:{ grid:{ display:false }, border:{ display:false }, ticks:{ font:{ size:15, weight:"700" } } },
        y:{ display:false }
      }
    }
  }));
}

const navItems = [
  ["Escolha",0],["Totais",1],["Impacto",2],["Viagens",3],["Intervalo",4],["Onde",10],["Cenários",13],["Frota",14],["Linhas",15],["Saldo",18]
];
const slides = [
  () => `<section class="slide choice-slide">
    <div class="reveal"><div class="kicker">TCGL · diretoria 2026</div><h1>Duas opções<br><em>de redução.</em></h1><p class="lead">Clique na proposta. As páginas seguintes seguem esse cenário.</p></div>
    <div class="choice">
      <button type="button" class="glass opt a reveal ${cenario===1?"pick":""}" data-escolhe="1">
        <div class="stat-k">Opção 1 · redução total</div>
        <div class="stat-v orange">${fmt(redMes[1])}</div>
        <div class="stat-s">quilômetros a menos por mês</div>
        <div class="facts">
          <div><b>${fmt(ano[1])}</b><span>km a menos no ano</span></div>
          <div><b>${fmt(viagensMes.corte1)}</b><span>viagens a menos no mês</span></div>
          <div><b>3.487 km</b><span>no dia útil · 353 viagens</span></div>
          <div><b>5.003 km</b><span>no sábado · 463 viagens</span></div>
          <div><b>3.363 km</b><span>no domingo · 430 viagens</span></div>
          <div><b>19 + 15</b><span>veículos no fim de semana</span></div>
        </div>
      </button>
      <button type="button" class="glass opt b reveal ${cenario===2?"pick":""}" data-escolhe="2">
        <div class="stat-k">Opção 2 · redução parcial</div>
        <div class="stat-v cyan">${fmt(redMes[2])}</div>
        <div class="stat-s">quilômetros a menos por mês</div>
        <div class="facts">
          <div><b>${fmt(ano[2])}</b><span>km a menos no ano</span></div>
          <div><b>${fmt(viagensMes.corte2)}</b><span>viagens a menos no mês</span></div>
          <div><b>2.187 km</b><span>no dia útil · 198 viagens</span></div>
          <div><b>5.003 km</b><span>no sábado · 463 viagens</span></div>
          <div><b>3.363 km</b><span>no domingo · 430 viagens</span></div>
          <div><b>19 + 15</b><span>veículos no fim de semana</span></div>
        </div>
      </button>
    </div>
  </section>`,
  () => {
    const fora = cenario === 1 ? 0 : reservaMes;
    const foraTexto = cenario === 1 ? "Tudo entra na redução" : "Fora desta proposta";
    return `<section class="slide"><div class="reveal"><div class="kicker">01 · ${nomeCenario()}</div><h1>Os quilômetros<br><em>do mês.</em></h1></div>
      <div class="quad">
        ${num("Km programado / mês", progMes, "Antes da redução")}
        ${num("Km reduzidos / mês", redAtual(), nomeCenario(), "orange")}
        ${num("Fica de fora / mês", fora, foraTexto, "green")}
        ${num("Total que fica / mês", ficaAtual(), "Programado menos a redução", "cyan")}
      </div></section>`;
  },
  () => `<section class="slide"><div class="reveal"><div class="kicker">02 · ${nomeCenario()}</div><h1>Impacto estimado<br><em>para decisão.</em></h1><p class="lead">Frequência revista, linhas integradas e períodos suspensos.</p></div>
    <div class="kpi-row">
      ${num("Viagens hoje / mês", viagensMes.antes)}
      ${num("Viagens depois / mês", viagensDepois(), "", "cyan")}
      ${num("Km hoje / mês", progMes)}
      ${num("Km que ficam / mês", ficaAtual(), "", "orange")}
    </div>
    <div class="fronts">
      <article class="glass reveal"><div class="stat-k">Frequências</div><p>O intervalo até o próximo ônibus aumenta no período da mudança.</p></article>
      <article class="glass reveal"><div class="stat-k">Integrações</div><p>Linhas se encontram em horários específicos e concentram a oferta.</p></article>
      <article class="glass reveal"><div class="stat-k">Retiradas</div><p>Trechos e períodos com menor demanda saem da programação.</p></article>
    </div></section>`,
  () => {
    const u = diaVista("util"), s = diaVista("sab"), d = diaVista("dom");
    return `<section class="slide"><div class="reveal"><div class="kicker">03 · ${nomeCenario()}</div><h1>Viagens<br><em>produtivas.</em></h1></div>
      <div class="kpi-3">
        ${num(u.nome, u.corteV, `${fmt(u.viagensA)} → ${fmt(u.viagensD)} por dia`, "orange")}
        ${num(s.nome, s.corteV, `${fmt(s.viagensA)} → ${fmt(s.viagensD)} por dia`, "orange")}
        ${num(d.nome, d.corteV, `${fmt(d.viagensA)} → ${fmt(d.viagensD)} por dia`, "orange")}
      </div>
      <article class="glass chart-slim reveal"><div class="stat-k">Viagens a menos por dia</div><canvas id="chartViagens"></canvas></article>
    </section>`;
  },
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · dias úteis · ${nomeCenario()}</div><h1>O intervalo<br><em>fica maior.</em></h1></div>${espHtml("util")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · dias úteis · ${nomeCenario()}</div><h1>O intervalo<br><em>fica maior.</em></h1><p class="lead">Linhas que param no período.</p></div>${paraHtml("util")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · sábados</div><h1>O intervalo<br><em>fica maior.</em></h1></div>${espHtml("sab")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · sábados</div><h1>O intervalo<br><em>fica maior.</em></h1><p class="lead">Linhas que param no sábado.</p></div>${paraHtml("sab")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · domingos</div><h1>O intervalo<br><em>fica maior.</em></h1></div>${espHtml("dom")}<article class="glass callout reveal"><div><div class="stat-k">Linha 417</div><div class="stat-s">Aumento de atendimento, de 13 para 71 viagens.</div></div><b>+58 viagens · +372,66 km</b></article></section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">04 · domingos</div><h1>O intervalo<br><em>fica maior.</em></h1><p class="lead">Linhas que param no domingo.</p></div>${paraHtml("dom")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">05 · dias úteis · ${nomeCenario()}</div><h1>Onde está<br><em>a redução.</em></h1></div>${ondeHtml("util", ["Entrepico","Entrepico e noite","Entrepico e tarde","Noite"], "u")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">05 · sábados</div><h1>Onde está<br><em>a redução.</em></h1></div>${ondeHtml("sab", ["Após as 14h","Após as 18h","Dia todo"], "s")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">05 · domingos</div><h1>Onde está<br><em>a redução.</em></h1></div>${ondeHtml("dom", ["Dia todo"], "d")}<article class="glass callout reveal"><div><div class="stat-k">Fora da redução</div><div class="stat-s">A linha 417 recebe viagens.</div></div><b>+58 viagens</b></article></section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">06 · as duas propostas</div><h1>Antes, depois<br><em>e a escolha.</em></h1><p class="lead">O total corta tudo. O parcial deixa onze linhas do dia útil como estão.</p></div>
    <div class="tres">
      ${num("Programado hoje", progMes, `${fmt(viagensMes.antes)} viagens por mês`)}
      <article class="glass a reveal ${cenario===1?"pick":""}"><div class="stat-k">1 · Cenário total</div><div class="stat-v orange" data-count="${redMes[1]}">0</div><div class="stat-s">km a menos por mês · ficam ${fmt(progMes-redMes[1])} · ${fmt(viagensMes.corte1)} viagens a menos</div></article>
      <article class="glass reveal ${cenario===2?"pick":""}"><div class="stat-k">2 · Cenário parcial</div><div class="stat-v cyan" data-count="${redMes[2]}">0</div><div class="stat-s">km a menos por mês · ficam ${fmt(progMes-redMes[2])} · ${fmt(reservaMes)} km ficam de fora</div></article>
    </div>
    <article class="glass chart-slim reveal"><div class="stat-k">Km a menos no mês, por tipo de dia</div><canvas id="chartCenarios"></canvas></article>
  </section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">07 · veículos</div><h1>Veículos a menos<br><em>em cada dia.</em></h1><p class="lead">${cenario===1?"Redução total de frota.":"No parcial, as 11 linhas do dia útil continuam com o veículo de hoje."}</p></div>
    <div class="kpi-3" style="flex:1">
      ${num("Dias úteis", 26, "veículos a menos", "cyan")}
      ${num("Sábados", 19, "veículos a menos", "orange")}
      ${num("Domingos", 15, "veículos a menos · 34 no fim de semana")}
    </div></section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">08 · dias úteis · ${nomeCenario()}</div><h1>Redução<br><em>por linha.</em></h1><p class="lead">↓ ${fmt(diaVista("util").km)} km neste dia.</p></div>${kmHtml("util")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">08 · sábados</div><h1>Redução<br><em>por linha.</em></h1><p class="lead">↓ ${fmt(5003)} km neste dia.</p></div>${kmHtml("sab")}</section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">08 · domingos</div><h1>Redução<br><em>por linha.</em></h1><p class="lead">↓ ${fmt(3363)} km neste dia.</p></div>${kmHtml("dom")}<article class="glass callout reveal"><div><div class="stat-k">Linha 417 soma km</div><div class="stat-s">13 → 71 viagens.</div></div><b>+372,66 km</b></article></section>`,
  () => `<section class="slide"><div class="reveal"><div class="kicker">09</div><h1>Saldo.</h1></div>
    <div class="pair-big">
      <article class="glass a reveal ${cenario===1?"pick":""}"><div class="stat-k">1 · Total</div><div class="stat-v orange" data-count="${redMes[1]}">0</div><div class="stat-s">km a menos por mês · ${fmt(ano[1])} no ano</div><div class="stat-v" style="font-size:clamp(36px,3vw,52px)" data-count="${progMes-redMes[1]}">0</div><div class="stat-s">km que ficam por mês · ${fmt(viagensMes.corte1)} viagens a menos</div></article>
      <article class="glass reveal ${cenario===2?"pick":""}"><div class="stat-k">2 · Parcial</div><div class="stat-v cyan" data-count="${redMes[2]}">0</div><div class="stat-s">km a menos por mês · ${fmt(ano[2])} no ano · ${fmt(reservaMes)} km ficam de fora</div><div class="stat-v" style="font-size:clamp(36px,3vw,52px)" data-count="${progMes-redMes[2]}">0</div><div class="stat-s">km que ficam por mês · ${fmt(viagensMes.corte2)} viagens a menos</div></article>
    </div>
    <article class="glass chart-slim reveal"><div class="stat-k">Km reduzidos no mês</div><canvas id="chartSaldo"></canvas></article>
  </section>`
];

function killCharts(){ charts.splice(0).forEach(c => c.destroy()); }
function animateIn(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    if (reduce){ el.textContent = fmt(end, dec) + suffix; return; }
  });
  if (reduce) return;
  slideTween = gsap.timeline({ defaults:{ ease:"power3.out" } });
  slideTween.from(root.querySelectorAll(".reveal"), { y:16, autoAlpha:0, duration:.5, stagger:.04 }, 0);
  slideTween.from(root.querySelectorAll(".bar"), { scaleX:0, duration:.6, stagger:.02, ease:"power3.out" }, .1);
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    const obj = { v:0 };
    slideTween.to(obj, { v:end, duration:.9, ease:"power2.out", onUpdate(){ el.textContent = fmt(obj.v, dec) + suffix; } }, .05);
  });
}
function drawCharts(){
  const u = diaVista("util");
  if (document.getElementById("chartViagens")) slim("chartViagens", ["Dias úteis","Sábados","Domingos"], [{ label:"Viagens", data:[u.corteV, 463, 430], color:"rgba(255,106,44,.9)" }]);
  if (document.getElementById("chartEspera")){
    const m = mediaUtil();
    slim("chartEspera", ["Dias úteis","Sábados","Domingos"], [{ label:"Minutos", data:[m.extra, 27, 43], color:"rgba(255,106,44,.9)" }]);
  }
  if (document.getElementById("chartCenarios") || document.getElementById("chartSaldo")){
    const id = document.getElementById("chartCenarios") ? "chartCenarios" : "chartSaldo";
    const util1 = redMes[1] - Math.round(5003*59/12) - Math.round(3363*53/12);
    const util2 = util1 - reservaMes;
    const sab = Math.round(5003*59/12);
    const dom = Math.round(3363*53/12);
    slim(id, ["Dias úteis","Sábados","Domingos"], [
      { label:"Total", data:[util1, sab, dom], color:"rgba(255,106,44,.92)" },
      { label:"Parcial", data:[util2, sab, dom], color:"rgba(61,225,255,.92)" }
    ]);
  }
}
function render(){
  killCharts();
  if (slideTween) slideTween.kill();
  app.innerHTML = slides[page]();
  pager.textContent = String(page+1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");
  gsap.to(bar, { width:((page+1)/slides.length*100)+"%", duration: reduce ? 0 : .4, ease:"power2.out" });
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", page >= Number(b.dataset.go) && page <= Number(b.dataset.end)));
  document.querySelectorAll("#cenarios button").forEach(b => b.classList.toggle("on", Number(b.dataset.cenario) === cenario));
  drawCharts();
  animateIn(app);
}
function go(n){
  const next = Math.max(0, Math.min(slides.length-1, n));
  if (next === page) return;
  const current = app.querySelector(".slide");
  if (!current || reduce){ page = next; render(); return; }
  gsap.to(current, { autoAlpha:0, y:-10, duration:.2, ease:"power2.in", onComplete(){ page = next; render(); } });
}
document.querySelector("#nav").innerHTML = navItems.map(([label,i], idx) => {
  const end = navItems[idx+1] ? navItems[idx+1][1]-1 : slides.length-1;
  return `<button data-go="${i}" data-end="${end}">${label}</button>`;
}).join("");
document.querySelector("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(Number(b.dataset.go)); });
app.addEventListener("click", e => {
  const card = e.target.closest("[data-escolhe]");
  if (!card) return;
  cenario = Number(card.dataset.escolhe);
  if (page === 0) go(1);
  else render();
});
document.querySelector("#cenarios").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  cenario = Number(b.dataset.cenario);
  render();
});
document.querySelector("#prev").onclick = () => go(page-1);
document.querySelector("#next").onclick = () => go(page+1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); go(page+1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(page-1); }
  if (e.key === "1"){ cenario = 1; render(); }
  if (e.key === "2"){ cenario = 2; render(); }
});
if (!reduce){
  gsap.to(".orb-a", { x:40, y:24, duration:9, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.to(".orb-b", { x:-30, y:-20, duration:11, yoyo:true, repeat:-1, ease:"sine.inOut" });
}
render();
</script>
</body>
</html>
