<!doctype html>
<html lang="pt-BR">
<head>
<script>document.documentElement.classList.add("portal-auth-pending");</script>
<style id="portalAuthBootStyle">.portal-auth-pending body > :not(#portalLoadingOverlay){pointer-events:none!important;}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de veículo | Portal CIOP</title>
<link rel="stylesheet" href="../assets/css/portal-tokens.css?v=20260820bar3">
<link rel="stylesheet" href="../assets/css/portal-unify.css?v=20260820r13">
<link rel="stylesheet" href="../assets/css/portal-header.css?v=20260818head3">
<link rel="stylesheet" href="../assets/css/portal-session.css?v=20260818open">
<link rel="stylesheet" href="../assets/css/portal-brand.css?v=20260818head3">
<link rel="stylesheet" href="../assets/css/portal-glass-desktop.css?v=20260820bar3">
<link rel="stylesheet" href="../assets/css/portal-futuristic.css?v=20260820bar2">
<script type="module" src="../assets/js/auth.js?v=20260820t21"></script>
<style>
body{margin:0;background:var(--fundo,#f5f7fb);color:#101828;font-family:var(--font,Inter,sans-serif);min-height:100vh}
.title-wrap h1{margin:0;font-size:22px;font-weight:800;color:#06245c}
.container{max-width:720px;margin:20px auto 40px;padding:0 18px}
.intro{margin:0 0 16px;color:#3f4757;font-weight:600;line-height:1.45}
.cv-panel{
  background:#fff;border:1px solid #dfe5ef;border-radius:12px;padding:20px 18px 22px;
}
.cv-panel h2{margin:0 0 8px;color:#06245c;font-size:16px}
.cv-busca-wrap{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.cv-busca-wrap input{
  flex:1;min-width:200px;min-height:44px;border:1px solid #dfe5ef;border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:700;color:#06245c;background:#fff;
}
.cv-status{margin:12px 0 0;font-size:13px;font-weight:700;color:#3f4757;min-height:1.2em}
.cv-status[data-tipo="erro"]{color:#b42318}
dialog.cv-popup{border:0;padding:0;border-radius:16px;max-width:min(560px,94vw);width:100%;box-shadow:0 24px 64px rgba(16,24,40,.28)}
dialog.cv-popup::backdrop{background:rgba(16,24,40,.45)}
.cv-popup-inner{background:#fff;border-radius:16px;overflow:hidden}
.cv-popup-inner img{display:block;width:100%;height:auto;max-height:280px;object-fit:cover;background:#0b1f44}
.cv-sem-foto{display:grid;place-items:center;min-height:120px;background:#eef2f7;color:#667085;font-weight:800;font-size:13px}
.cv-popup-body{padding:16px 18px 18px}
.cv-popup-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.cv-popup-head h2{margin:0;font-size:22px;color:#06245c}
.cv-fechar{border:0;background:#e8edf6;border-radius:10px;min-height:36px;padding:0 12px;font-weight:800;color:#06245c;cursor:pointer}
.cv-dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:14px}
.cv-dl dt{margin:0;color:#667085;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:4px}
.cv-dl dd{margin:0;font-weight:800;color:#101828}
@media (min-width:721px){
  body{background:transparent !important}
  .body-bg-wall{
    position:fixed;inset:0;z-index:-3;
    background-image:url('../assets/img/portal-bg-onibus.jpg?v=20260718j');
    background-size:cover;background-position:center;background-repeat:no-repeat
  }
  .body-bg-stain{
    position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:linear-gradient(180deg, rgba(6,20,50,.30) 0%, rgba(6,20,50,.55) 100%)
  }
  html:not(.dk-dark) .header{
    background:linear-gradient(90deg, #d5e0ee 0%, #e7eef6 42%, #f4f7fb 78%, #ffffff 100%) !important;
    border-bottom:1px solid #d7e1ec !important;
    box-shadow:0 8px 24px -18px rgba(20,20,40,.22) !important
  }
  html.dk-dark .header{
    background:
      radial-gradient(120% 160% at 92% 0%, #3d6aa8 0%, transparent 46%),
      linear-gradient(135deg, #0b1628 0%, #152a4a 52%, #1c3d66 100%) !important;
    border-bottom:1px solid rgba(120,170,220,.22) !important
  }
  html:not(.dk-dark) .cv-panel{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%)
  }
  html.dk-dark .cv-panel{
    background:rgba(16,24,40,.82);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border-color:rgba(186,210,230,.28)
  }
  html.dk-dark .intro,
  html.dk-dark .cv-panel h2,
  html.dk-dark .cv-status{color:#e8eef6}
  html.dk-dark .cv-busca-wrap input{
    background:rgba(255,255,255,.1);color:#f8fafc;border-color:rgba(186,210,230,.35)
  }
  html.dk-dark dialog.cv-popup .cv-popup-inner{background:#1a2434}
  html.dk-dark .cv-popup-head h2,
  html.dk-dark .cv-dl dd{color:#f8fafc}
  html.dk-dark .cv-dl dt,
  html.dk-dark .cv-fechar{color:#c5ced8;background:#243044}
}
</style>
</head>
<body>
<div class="body-bg-wall" aria-hidden="true"></div>
<div class="body-bg-stain" aria-hidden="true"></div>
<header class="header">
  <a class="portal-brand-mark" href="../index.html" aria-label="Portal CIOP"><img class="portal-brand-art" src="../assets/img/logomarca-portalciop-tcgl-claro.png?v=20260818logo6" alt="Portal CIOP"></a>
  <div class="title-wrap"><h1>Consulta de veículo</h1></div>
  <div class="header-actions">
    <div class="ciop-session">
      <span id="usuarioLogado" class="ciop-session-user">Usuário</span>
      <span id="perfilUsuario" class="ciop-session-cargo" hidden></span>
      <button onclick="logout()" class="btn-logout" type="button">Sair</button>
    </div>
  </div>
</header>
<main class="container">
  <a class="btn-portal" href="../index.html" style="display:inline-flex;margin-bottom:14px;background:#06245c;color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:800">Portal</a>
  <p class="intro">Busque por prefixo, placa, tecnologia ou modelo. Especiais não têm foto.</p>
  <section class="cv-panel">
    <h2>Buscar na frota</h2>
    <div class="cv-busca-wrap">
      <input id="cvBusca" type="search" autocomplete="off" placeholder="Ex.: 1042, ATR 8J28, pesado azul" aria-label="Buscar veículo">
      <button type="button" class="btn-portal" id="cvConsultar" style="background:#06245c;color:#fff;border:0;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer">Consultar</button>
    </div>
    <p class="cv-status" id="cvStatus" role="status"></p>
  </section>
</main>

<dialog class="cv-popup" id="cvPopup" aria-labelledby="cvPrefixo">
  <div class="cv-popup-inner">
    <img id="cvFoto" alt="" hidden>
    <div class="cv-sem-foto" id="cvSemFoto" hidden>Sem foto</div>
    <div class="cv-popup-body">
      <div class="cv-popup-head">
        <h2 id="cvPrefixo">—</h2>
        <button type="button" class="cv-fechar" id="cvFechar">Fechar</button>
      </div>
      <dl class="cv-dl">
        <dt>Placa</dt><dd id="cvPlaca">—</dd>
        <dt>Tecnologia</dt><dd id="cvTec">—</dd>
        <dt>Modelo</dt><dd id="cvModelo">—</dd>
        <dt id="cvTamDt">Tamanho</dt><dd id="cvTamanho">—</dd>
      </dl>
    </div>
  </div>
</dialog>

<script src="../assets/js/frota-consulta-data.js"></script>
<script src="../assets/js/consulta-veiculo.js?v=20260820tam2"></script>
</body>
</html>
