</style>

function cortes(dia){ return pacote[dia].filter(r => r.corta > 0 && !(coletiva && dia === "util" && foraUtil.has(r.linha))); }
function fmtKm(n){
  const v = Math.round(Math.abs(Number(n)) * 100) / 100;
  const dec = Number.isInteger(v) ? 0 : 2;
  return fmt(v, dec);
}
function num(k, v, s, cls, dec){
  const d = dec == null ? 0 : dec;
  return `<article class="glass reveal"><div class="stat-k">${k}</div><div class="stat-v ${cls||""}" data-count="${v}" data-dec="${d}">0</div>${s ? `<div class="stat-s">${s}</div>` : ""}</article>`;
}
function espHtml(dia){
  const rows = cortes(dia).filter(r => r.espA != null).sort((a,b) => (b.espD-b.espA) - (a.espD-a.espA));
  return `<div class="esp-list">${rows.map(r => `<div class="esp-row reveal"><span class="code">${r.linha}</span><span class="mins">${r.espA} → ${r.espD} min</span><span class="plus">+${r.espD - r.espA}</span></div>`).join("")}</div>`;
}
function paraHtml(dia){
  const rows = cortes(dia).filter(r => r.espA == null);
  return `<div class="esp-list">${rows.map(r => `<div class="esp-row reveal"><span class="code">${r.linha}</span><span class="mins">${r.periodo}</span><span class="stop">serviço suspenso</span></div>`).join("")}</div>`;
}
function kmHtml(dia){
  const rows = cortes(dia).slice().sort((a,b) => b.km - a.km);
  const max = Math.max(...rows.map(r => r.km));
  return `<div class="km-list">${rows.map(r => `<div class="km-row reveal"><b>${fmtKm(r.km)} km</b><span class="code">${r.linha}</span><i class="bar" style="--w:${(r.km / max * 100).toFixed(1)}%"></i></div>`).join("")}</div>`;
}
function ondeHtml(dia, periodos, cls){
  const blocos = periodos.map(p => {
    const rows = cortes(dia).filter(r => r.periodo === p).sort((a,b) => b.corta - a.corta);
    const itens = rows.map(r => {
      const espera = r.espA == null ? "serviço suspenso" : `${r.espA} → ${r.espD} min`;
      return `<li><span class="ln">${r.linha}</span><span class="meta">↓ ${r.corta} · ${espera}</span></li>`;
    }).join("");
    return `<article class="glass zone reveal"><h2>${p}</h2><ul>${itens}</ul></article>`;
  }).join("");
  return `<div class="onde ${cls}">${blocos}</div>`;
}
function slim(id, labels, series){
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts.push(new Chart(ctx, {
    type:"bar",
    data:{
      labels,
      datasets: series.map(s => ({
        label:s.label, data:s.data, backgroundColor:s.color, borderRadius:8, maxBarThickness:36
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:series.length > 1, labels:{ boxWidth:10, boxHeight:10, usePointStyle:true, font:{ size:14, weight:"700" } } } },
      scales:{
        x:{ grid:{ display:false }, border:{ display:false }, ticks:{ font:{ size:15, weight:"700" } } },
        y:{ display:false }
      }
    }
  }));
}

const AJUSTE_MIN = 70000;
const MULT = { dom:53/12, sab:59/12, util:253/12 };
const ordemUtil = ["800","802","806","900","913","101","106","107","303","306","501","420","311","110/111","112","113","351","404","405","803"];
const tipoNome = { dom:"Domingo", sab:"Sábado", util:"Dia útil" };
let ajusteKm = null;
function totalSeq(){
  const seq = sequenciaKm();
  return seq.length ? seq[seq.length - 1].acum : AJUSTE_MIN;
}
function sequenciaKm(){
  const lista = [];
  const push = (dia, rows) => rows.forEach(r => {
    if (coletiva && dia === "util" && foraUtil.has(r.linha)) return;
    lista.push({ dia, linha:r.linha, periodo:r.linha === "417" ? "Oferta aumenta" : r.periodo, mes:r.km * MULT[dia] });
  });
  push("dom", pacote.dom);
  push("sab", pacote.sab);
  push("util", ordemUtil.map(cod => pacote.util.find(r => r.linha === cod)).filter(Boolean));
  let acc = 0;
  return lista.map(item => {
    const antes = acc;
    acc += item.mes;
    return { ...item, antes, acum:acc };
  });
}
function classificar(item, alvo){
  if (item.mes < 0) return item.antes < alvo - 0.001 ? { estado:"reforco", entra:item.mes } : { estado:"out", entra:0 };
  if (item.antes >= alvo - 0.001) return { estado:"out", entra:0 };
  if (item.acum <= alvo + 0.001) return { estado:"in", entra:item.mes };
  return { estado:"partial", entra:alvo - item.antes };
}
function textoAjuste(rows, alvo){
  const ativos = rows.filter(r => r.estado === "in" || r.estado === "partial");
  if (!ativos.length) return "Nada sai neste total. O controle sobe até 70.000 km no mês, na ordem da planilha: domingo, sábado e dia útil.";
  const kmDia = dia => rows.filter(r => r.dia === dia && r.estado !== "out").reduce((s,r) => s + r.entra, 0);
  const pedacos = [];
  if (kmDia("dom") > 0.5) pedacos.push(`${fmt(kmDia("dom"), 0)} km no domingo`);
  if (kmDia("sab") > 0.5) pedacos.push(`${fmt(kmDia("sab"), 0)} km no sábado`);
  if (kmDia("util") > 0.5) pedacos.push(`${fmt(kmDia("util"), 0)} km no dia útil`);
  const borda = ativos[ativos.length - 1];
  const onde = borda.estado === "partial"
    ? `A soma passa de ${fmt(alvo, 0)} km na linha ${borda.linha} (${tipoNome[borda.dia].toLowerCase()}): entram ${fmt(borda.entra, 0)} km dos ${fmt(borda.mes, 0)} dessa linha.`
    : `A soma fecha na linha ${borda.linha} (${tipoNome[borda.dia].toLowerCase()}).`;
  const reforcoRow = rows.find(r => r.estado === "reforco");
  const reforco = reforcoRow ? ` A linha 417 devolve ${fmt(Math.abs(reforcoRow.entra), 0)} km, porque a oferta dela aumenta.` : "";
  const lista = pedacos.join(", ").replace(/, ([^,]*)$/, " e $1");
  return `Saem ${lista}. ${onde}${reforco}`;
}
function pintarFolha(){
  const body = document.getElementById("folhaBody");
  if (!body) return;
  const teto = totalSeq();
  const alvo = ajusteKm >= Math.round(teto) - 0.5 ? teto : ajusteKm;
  const base = sequenciaKm();
  const rows = base.map(item => ({ ...item, ...classificar(item, alvo) }));
  const sit = { in:"Sai", partial:"Parte", out:"Fica", reforco:"Reforço" };
  let edge = -1;
  rows.forEach((r,i) => { if (r.estado !== "out") edge = i; });
  body.innerHTML = rows.map((r,i) => {
    const km = r.mes < 0 ? "−" + fmt(Math.abs(r.mes), 2) : fmt(r.mes, 2);
    const situacao = r.estado === "partial" ? `Parte · ${fmt(r.entra, 0)} km` : sit[r.estado];
    return `<tr class="${r.estado}" ${i === edge ? "id=\"folhaEdge\"" : ""}><td class="${r.dia}">${tipoNome[r.dia]}</td><td>${r.linha}</td><td>${r.periodo}</td><td class="num">${km}</td><td class="num">${fmt(r.acum, 2)}</td><td>${situacao}</td></tr>`;
  }).join("");
  const net = { dom:0, sab:0, util:0 };
  rows.forEach(r => { net[r.dia] += r.entra; });
  document.getElementById("pillDom").textContent = fmt(net.dom, 0);
  document.getElementById("pillSab").textContent = fmt(net.sab, 0);
  document.getElementById("pillUtil").textContent = fmt(net.util, 0);
  document.getElementById("pillTot").textContent = fmt(alvo, 0);
  document.getElementById("ajusteOut").textContent = fmt(alvo, 0);
  document.getElementById("ajusteFrase").textContent = textoAjuste(rows, alvo);
  const escala = teto || 1;
  document.getElementById("segDom").style.width = Math.max(0, net.dom) / escala * 100 + "%";
  document.getElementById("segSab").style.width = Math.max(0, net.sab) / escala * 100 + "%";
  document.getElementById("segUtil").style.width = Math.max(0, net.util) / escala * 100 + "%";
  const piso = document.getElementById("pisoMin");
  if (piso) piso.style.left = (AJUSTE_MIN / escala * 100) + "%";
  const wrap = document.getElementById("sheetWrap");
  const mark = document.getElementById("folhaEdge");
  if (wrap && mark && rows[edge] && rows[edge].estado === "partial"){
    const er = mark.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    if (er.top < wr.top + 28 || er.bottom > wr.bottom - 8) wrap.scrollTop += er.top - wr.top - wr.height * 0.35;
  }
}
function ligarFolha(){
  const input = document.getElementById("ajusteKm");
  if (!input) return;
  const topo = Math.round(totalSeq());
  if (ajusteKm == null || ajusteKm < AJUSTE_MIN || ajusteKm > topo) ajusteKm = topo;
  input.min = String(AJUSTE_MIN);
  input.max = String(topo);
  input.step = "1";
  input.value = String(ajusteKm);
  input.addEventListener("input", () => {
    ajusteKm = Math.min(topo, Math.max(AJUSTE_MIN, Number(input.value)));
    pintarFolha();
  });
  pintarFolha();
}

function animateIn(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    if (reduce){ el.textContent = fmt(end, dec) + suffix; return; }
  });
  if (reduce) return;
  slideTween = gsap.timeline({ defaults:{ ease:"power3.out" } });
  slideTween.from(root.querySelectorAll(".reveal"), { y:24, autoAlpha:0, duration:.62, stagger:{ each:.045, from:"start" } }, 0);
  slideTween.from(root.querySelectorAll(".bar"), { scaleX:0, duration:.7, stagger:.025, ease:"power2.out" }, .18);
  root.querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count);
    const dec = Number(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || "";
    const obj = { v:0 };
    slideTween.to(obj, { v:end, duration:.9, ease:"power2.out", onUpdate(){ el.textContent = fmt(obj.v, dec) + suffix; } }, .05);
  });
}
function drawCharts(){
  const u = diaVista("util"), s = diaVista("sab"), d = diaVista("dom");
  if (document.getElementById("chartViagens")) slim("chartViagens", ["Dias úteis","Sábados","Domingos"], [{ label:"Viagens", data:[u.corteV, s.corteV, d.corteV], color:"rgba(255,106,44,.9)" }]);
  if (document.getElementById("chartSaldo")) slim("chartSaldo", ["Dias úteis","Sábados","Domingos"], [{ label:"Km no mês", data:[mesTipo.util, mesTipo.sab, mesTipo.dom], color:"rgba(255,106,44,.92)" }]);
}
function render(){
  killCharts();
  if (slideTween) slideTween.kill();
  app.innerHTML = slides[page]();
  pager.textContent = String(page+1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");
  gsap.to(bar, { width:((page+1)/slides.length*100)+"%", duration: reduce ? 0 : .4, ease:"power2.out" });
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", page >= Number(b.dataset.go) && page <= Number(b.dataset.end)));
  drawCharts();
  animateIn(app);
  ligarFolha();
}
function go(n){
  const next = Math.max(0, Math.min(slides.length-1, n));
  if (next === page) return;
  const current = app.querySelector(".slide");
  if (!current || reduce){ page = next; render(); return; }
  gsap.to(current, { autoAlpha:0, y:-10, duration:.2, ease:"power2.in", onComplete(){ page = next; render(); } });
}
document.querySelector("#nav").innerHTML = navItems.map(([label,i], idx) => {
  const end = navItems[idx+1] ? navItems[idx+1][1]-1 : slides.length-1;
  return `<button data-go="${i}" data-end="${end}">${label}</button>`;
}).join("");
document.querySelector("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(Number(b.dataset.go)); });
document.querySelector("#prev").onclick = () => go(page-1);
document.querySelector("#next").onclick = () => go(page+1);
function alternarTelaCheia(){
  const ativo = document.fullscreenElement || document.webkitFullscreenElement;
  if (!ativo){
    const pedir = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    if (pedir) pedir.call(document.documentElement);
  } else {
    const sair = document.exitFullscreen || document.webkitExitFullscreen;
    if (sair) sair.call(document);
  }
}
document.addEventListener("keydown", e => {
  if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); alternarTelaCheia(); return; }
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); go(page+1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(page-1); }
});
if (!reduce){
  gsap.to(".orb-a", { x:40, y:24, duration:9, yoyo:true, repeat:-1, ease:"sine.inOut" });
  gsap.to(".orb-b", { x:-30, y:-20, duration:11, yoyo:true, repeat:-1, ease:"sine.inOut" });
}
render();
</script>
</body>
</html>
