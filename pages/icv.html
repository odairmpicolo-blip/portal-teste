<style>
/* ===== Redesign iOS26 Liquid Glass (desktop) =====
   Fundo com parede de traços + mancha do laço do mês, vidro no
   header/toolbar/kpi/gráfico/tabela/filtros, hover nos botões.
   Colocado após os <link> externos para vencer o cascade sem !important. */
@media (min-width:721px){
  body{
    position:relative;
    background:var(--bg);
  }
  .body-bg-wall{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    background-image:url('../assets/img/portal-bg-onibus.jpg?v=20260718j');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .body-bg-stain{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(6,20,50,.30) 0%, rgba(6,20,50,.55) 100%);
  }

  .header{
    background:rgba(255,255,255,.6) !important;
    backdrop-filter:blur(18px) saturate(190%);
    -webkit-backdrop-filter:blur(18px) saturate(190%);
    border-bottom:1px solid rgba(255,255,255,.5);
    box-shadow:0 10px 28px -16px rgba(20,20,40,.3), inset 0 1px 0 rgba(255,255,255,.4);
  }

  footer.portal-site-footer{
    background:rgba(255,255,255,.42) !important;
    backdrop-filter:blur(16px) saturate(190%) !important;
    -webkit-backdrop-filter:blur(16px) saturate(190%) !important;
    border-top:1px solid rgba(255,255,255,.5) !important;
    box-shadow:0 -10px 28px -16px rgba(20,20,40,.3), inset 0 1px 0 rgba(255,255,255,.4) !important;
  }
  footer.portal-site-footer .footer-text{
    color:#3f4757 !important;
  }

  .toolbar,.kpi-card,.chart-card,.table-card,.sidebar.portal-filters-bar{
    background:rgba(255,255,255,.42) !important;
    backdrop-filter:blur(16px) saturate(190%);
    -webkit-backdrop-filter:blur(16px) saturate(190%);
    border:1px solid rgba(255,255,255,.5) !important;
    box-shadow:0 12px 30px -16px rgba(20,20,40,.3), inset 0 1px 0 rgba(255,255,255,.4) !important;
  }

  .kpi-container{
    width:100% !important;
    align-items:stretch !important;
  }
  .kpi-card{
    width:100% !important;
    height:100% !important;
    min-height:92px !important;
    display:flex !important;
    flex-direction:column !important;
    justify-content:center !important;
    box-sizing:border-box !important;
  }

  .chart-card{
    background:rgba(255,255,255,.72) !important;
  }
  .kpi-card.highlight{
    background:linear-gradient(to right, rgba(240,253,250,.75), rgba(255,255,255,.55)) !important;
  }

  .btn-portal{
    min-height:44px !important;padding:8px 14px !important;border-radius:10px !important;font-size:14px !important;
    background:linear-gradient(135deg, rgba(6,36,92,.85), rgba(11,58,138,.85)) !important;
  }
  .btn-portal:hover{
    background:linear-gradient(135deg, var(--orange), #ff8f3d) !important;
    transform:translateY(-2px);
    box-shadow:0 14px 28px -12px rgba(255,107,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .ciop-session,
  .ciop-session.ciop-session-modern{
    background:rgba(255,255,255,.26) !important;
    backdrop-filter: blur(24px) saturate(200%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
    border: 1px solid rgba(255,255,255,.5) !important;
    border-radius:16px !important;
    box-shadow: 0 10px 28px -14px rgba(6,20,50,.4), inset 0 1px 0 rgba(255,255,255,.55) !important;
  }
  .btn-pdf-pontualidade,.btn-modulo-link{
    background:rgba(255,255,255,.42) !important;
  }
  .btn-pdf-pontualidade:hover:not(:disabled),.btn-modulo-link:hover{
    background:rgba(224,235,255,.85) !important;
    transform:translateY(-2px);
    box-shadow:0 14px 28px -14px rgba(6,36,92,.35), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .btn-portal,.btn-pdf-pontualidade,.btn-modulo-link{
    transition:transform .2s ease, background .25s ease, box-shadow .25s ease, color .25s ease !important;
  }
}
</style>
<link rel="stylesheet" href="../assets/css/portal-glass-desktop.css?v=20260720y">

<link rel="stylesheet" href="../assets/css/portal-fx.css?v=20260817ag">
</head>
<body>
<div class="body-bg-wall" aria-hidden="true"></div>
<div class="body-bg-stain" aria-hidden="true"></div>
<div class="header">
    <a class="portal-brand-mark" href="../index.html" aria-label="Portal CIOP TCGL Operações"><img class="portal-brand-art" src="../assets/img/titulo-portal-ciop.png" alt="Portal CIOP"><span class="portal-brand-meta">TCGL · Operações</span></a>
    <div class="icv-title-wrap">
        <h1 class="icv-title-art" aria-label="Índice de Cumprimento de Viagem - ICV">Índice de Cumprimento de Viagem - ICV</h1>
        <div class="subtitle" id="dashboardSubtitle">CIOP / TCGL</div>
    </div>
    <div class="header-actions">
<div class="ciop-session" aria-label="Sessão do usuário">
    <span id="usuarioLogado" class="ciop-session-user">Usuário</span>
    <span id="perfilUsuario" class="ciop-session-cargo" hidden></span>
    <button data-portal-senha-btn="1" onclick="toggleSenhaPanel()" class="btn-senha-portal" type="button">Senha</button>
    <button onclick="logout()" class="btn-logout" type="button">Sair</button>
</div>
        <a href="https://www.tcgrandelondrina.com.br/" target="_blank" rel="noopener" class="logo-tcgl-link" aria-label="Site TCGL">
            <img class="logo-tcgl" src="../assets/img/LOGO_TCGL-removebg-preview.png" alt="TCGL">
        </a>
    </div>
</div>
<div class="main-content">
    <div class="content-body">
        <div class="toolbar">
            <div class="toolbar-actions">
                <a href="../index.html" class="btn-portal" aria-label="Voltar ao portal">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></span>
                    <span>Portal</span>
                </a>
                <button type="button" class="btn-pdf-pontualidade" id="btnExportarPdf" disabled aria-label="Exportar PDF">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>
                    <span>PDF</span>
                </button>
                <a href="pontualidade.html" class="btn-modulo-link" aria-label="Ir para Pontualidade IPV">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v6l4 2"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span>
                    <span>IPV</span>
                </a>
            </div>
        </div>
        <p class="pdf-status" id="pdfStatus" hidden></p>

        <div class="kpi-container">
            <div class="kpi-card highlight">
                <div class="kpi-title">Melhor mês de ICV</div>
                <div class="kpi-value" id="kpiMelhorMes">-</div>
                <div class="kpi-sub" id="kpiMelhorMesLabel">--</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Viagens programadas</div>
                <div class="kpi-value" id="kpiViagProg">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Viagens realizadas</div>
                <div class="kpi-value" id="kpiViagens">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Supressão</div>
                <div class="kpi-value" id="kpiSupressao">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">% Supressão</div>
                <div class="kpi-value" id="kpiPctSupressao">-</div>
            </div>
        </div>

        <div class="sidebar portal-filters-bar">
            <div class="filter-group">
                <label for="anoFilter">Filtrar por Ano</label>
                <select id="anoFilter" class="filter-select" onchange="updateFilters('ano')"><option value="todos">Todos os Anos</option></select>
            </div>
            <div class="filter-group">
                <label for="trimestreFilter">Filtrar por Trimestre</label>
                <select id="trimestreFilter" class="filter-select" onchange="updateFilters('trimestre')">
                    <option value="todos">Todos os Trimestres</option>
                    <option value="Q1">1º Trimestre (Jan - Mar)</option>
                    <option value="Q2">2º Trimestre (Abr - Jun)</option>
                    <option value="Q3">3º Trimestre (Jul - Set)</option>
                    <option value="Q4">4º Trimestre (Out - Dez)</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="mesFilter">Filtrar por Mês</label>
                <select id="mesFilter" class="filter-select" onchange="updateFilters('mes')">
                    <option value="todos">Todos os Meses</option>
                    <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option>
                    <option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option>
                    <option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="diaFilter">Filtrar por Dia</label>
                <select id="diaFilter" class="filter-select" onchange="updateFilters('dia')"><option value="todos">Todos os Dias</option></select>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header"><div class="chart-title" id="chartDynamicTitle">ICV</div></div>
            <div class="chart-container"><canvas id="barChartCanvas"></canvas></div>
        </div>

        <div class="table-card">
            <div class="table-card-header"><span id="tableDynamicTitle">Detalhamento dos Dados</span></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th id="thColPeriodo">Período</th>
                            <th>Viag. Prog</th>
                            <th>Viagens</th>
                            <th>Supressão</th>
                            <th>ICV</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script type="module">
import { iniciarIcvDashboard } from "../assets/js/icv-dashboard.js?v=20260817i";
import { exportarPdfIcv } from "../assets/js/icv-relatorio-export.js?v=20260702d";
window.exportarPdfIcv = exportarPdfIcv;
window.onload = () => window.portalAguardarUsuario?.(iniciarIcvDashboard);
</script>
<script src="../assets/js/portal-futuristic.js?v=20260718am" defer></script>
</body>
