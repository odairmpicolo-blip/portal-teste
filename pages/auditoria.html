<!doctype html>
<html lang="pt-BR">
<head>
<script>document.documentElement.classList.add("portal-auth-pending");</script>
<style id="portalAuthBootStyle">.portal-auth-pending body > :not(#portalLoadingOverlay){pointer-events:none!important;}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria | Portal CIOP</title>
<link rel="stylesheet" href="../assets/css/portal-tokens.css?v=20260818p">
<link rel="stylesheet" href="../assets/css/portal-unify.css?v=20260820r9">
<link rel="stylesheet" href="../assets/css/portal-header.css?v=20260818head3">
<link rel="stylesheet" href="../assets/css/portal-session.css?v=20260818open">
<link rel="stylesheet" href="../assets/css/portal-brand.css?v=20260818head3">
<script type="module" src="../assets/js/auth.js?v=20260820t14"></script>
<style>
body{margin:0;background:var(--bg,#f5f7fb);color:#101828;font-family:var(--font,Inter,sans-serif)}
.container{max-width:1100px;margin:20px auto 40px;padding:0 18px}
.intro{margin:0 0 16px;color:#3f4757;font-weight:600;line-height:1.45}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dfe5ef;border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf2f7;font-size:13px;vertical-align:top}
th{background:#f8fafc;color:#06245c;font-size:11px;text-transform:uppercase}
.fail{color:#b42318;font-weight:800}
a.ext{font-weight:700;color:#0b3a8a}
code{font-size:12px}
</style>
</head>
<body data-require-perfis="Administrador">
<header class="header">
  <a class="portal-brand-mark" href="../index.html" aria-label="Portal CIOP"><img class="portal-brand-art" src="../assets/img/logomarca-portalciop-tcgl-claro.png?v=20260818logo6" alt="Portal CIOP"></a>
  <div class="title-wrap"><h1 style="margin:0;color:#06245c;font-size:22px">Auditoria</h1></div>
  <div class="header-actions">
    <div class="ciop-session">
      <span id="usuarioLogado" class="ciop-session-user">Usuário</span>
      <span id="perfilUsuario" class="ciop-session-cargo" hidden></span>
      <button onclick="logout()" class="btn-logout" type="button">Sair</button>
    </div>
  </div>
</header>
<main class="container">
  <a class="btn-portal" href="../index.html" style="display:inline-flex;margin-bottom:14px;background:#06245c;color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:800">Portal</a>
  <p class="intro">Escritas da API DSQL (<code>audit_log</code>). Login e 2FA ficam no console Firebase — não há trilha de senha aqui. Importações grandes geram um evento, não uma linha por ônibus.</p>
  <p id="statusAudit" class="intro">Carregando…</p>
  <table>
    <thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Tabela</th><th>Chave</th></tr></thead>
    <tbody id="linhasAudit"></tbody>
  </table>
  <p class="intro"><a class="ext" href="automacoes.html">Automações</a> · <a class="ext" href="integracoes.html">Integrações</a></p>
</main>
<script type="module">
import { initPortalAwsRuntime, awsFetch, firebaseIdToken } from "../assets/js/portal-aws-config.js";

function fmtQuando(v) {
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v || "");
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function carregar() {
  const status = document.getElementById("statusAudit");
  const tbody = document.getElementById("linhasAudit");
  try {
    await initPortalAwsRuntime();
    const token = await firebaseIdToken();
    const data = await awsFetch("/audit?limite=80", { token });
    const itens = data.itens || [];
    status.textContent = itens.length ? itens.length + " evento(s) mais recentes." : "Nenhum evento ainda.";
    tbody.innerHTML = itens.map((r) =>
      "<tr><td>" + fmtQuando(r.quando) + "</td><td>" + (r.uid || "—") + "</td><td>" + (r.acao || "") + "</td><td>" + (r.tabela || "") + "</td><td><code>" + String(r.chave || "").replace(/</g, "") + "</code></td></tr>"
    ).join("");
  } catch (err) {
    status.innerHTML = '<span class="fail">' + (window.portalMensagemErro?.(err) || err.message) + "</span>";
  }
}

if (window.portalUsuarioValidado) carregar();
else window.addEventListener("portal:usuario-validado", carregar, { once: true });
</script>
</body>
</html>
