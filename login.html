<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
if (/[?&](app|novo)=1(?:&|$)/.test(location.search)) {
  location.replace("/app/login");
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06245c">
<link rel="manifest" href="assets/pwa/manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/logomarca-portalciop-tcgl-claro.png?v=20260818logo6">
<title>Portal CIOP / TCGL</title>
<link rel="stylesheet" href="assets/css/portal-login-v2.css?v=20260820i">
<link rel="stylesheet" href="assets/css/portal-brand.css?v=20260818head3">
<script src="assets/js/theme-toggle.js?v=20260818logo6"></script>
<link rel="stylesheet" href="assets/css/portal-titulos.css">
<link rel="stylesheet" href="assets/css/portal-footer.css">
<link rel="stylesheet" href="assets/css/portal-tokens.css?v=20260820bar4">
<link rel="stylesheet" href="assets/css/portal-unify.css?v=20260820r14">
</head>
<body class="login-v2">

<div class="bg-wall" aria-hidden="true"></div>
<div class="bg-wall-shade" aria-hidden="true"></div>

<div class="login-page-v2">
  <div class="login-stack-v2">
    <div class="login-brand-v2 portal-brand-mark" aria-label="Portal CIOP TCGL Operações">
      <img class="portal-brand-art" src="assets/img/logomarca-portalciop-tcgl-claro-login.png?v=20260818logo6" alt="Portal CIOP TCGL Operações" fetchpriority="high" decoding="async">
    </div>
    <form class="login-card-v2" onsubmit="event.preventDefault(); login();">
    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      autocomplete="username"
      placeholder="usuario@empresa.com.br"
      required
    >

    <label for="senha">Senha</label>
    <input
      type="password"
      id="senha"
      autocomplete="current-password"
      required
    >

    <div id="mfaBox" hidden>
      <label for="mfaCodigo">Código do autenticador (2FA)</label>
      <input
        type="text"
        id="mfaCodigo"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="8"
      >
    </div>

    <div id="erro" class="login-error-v2" role="alert" hidden></div>

    <button type="submit" class="btn-primary" id="btnEntrar">
      Entrar
    </button>

    <button type="button" class="btn-link" onclick="resetarSenha()">
      Esqueci minha senha
    </button>
    </form>
  </div>
</div>

<script src="assets/js/loading.js?v=20260718d"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 sendPasswordResetEmail,
 setPersistence,
 browserSessionPersistence,
 getMultiFactorResolver,
 TotpMultiFactorGenerator
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { firebaseConfig } from "./assets/js/firebase-config.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let mfaResolver = null;

function mostrarMfa(mostrar) {
  const box = document.getElementById("mfaBox");
  if (box) box.hidden = !mostrar;
}

function mostrarCarregando(texto) {
  window.portalMostrarCarregando?.(texto || "Carregando");
}

function ocultarCarregando() {
  window.portalOcultarCarregando?.();
}

function mostrarErro(mensagem) {
  const el = document.getElementById("erro");
  if (!mensagem) {
    el.hidden = true;
    el.textContent = "";
    return;
  }
  el.hidden = false;
  el.textContent = mensagem;
}

function mensagemErroLogin(error) {
  const code = error && error.code ? error.code : "";
  if (code === "auth/user-not-found" || code === "auth/invalid-credential") {
    return "E-mail ou senha incorretos. Confirme se seu usuário e senha estão corretos.";
  }
  if (code === "auth/wrong-password") {
    return "Senha incorreta.";
  }
  if (code === "auth/invalid-email") {
    return "E-mail inválido.";
  }
  if (code === "auth/too-many-requests") {
    return "Muitas tentativas. Aguarde um pouco e tente novamente.";
  }
  if (code === "auth/multi-factor-auth-required") {
    return "Informe o código do autenticador.";
  }
  if (code === "auth/invalid-verification-code") {
    return "Código 2FA inválido.";
  }
  return "Não foi possível entrar: " + (error.message || code);
}

window.login = async function(){

 const email =
 document.getElementById("email").value;

 const senha =
 document.getElementById("senha").value;

 const codigoMfa = document.getElementById("mfaCodigo")?.value || "";

 const btn = document.getElementById("btnEntrar");

 try{

   mostrarErro("");
   btn.disabled = true;
   btn.textContent = "Entrando…";
   mostrarCarregando("Entrando no portal");

   await setPersistence(auth, browserSessionPersistence);

   if (mfaResolver) {
     const hint = mfaResolver.hints.find((h) => h.factorId === TotpMultiFactorGenerator.FACTOR_ID)
       || mfaResolver.hints[0];
     if (!hint || !codigoMfa) {
       throw Object.assign(new Error("Informe o código 2FA."), { code: "auth/multi-factor-auth-required" });
     }
     const assertion = TotpMultiFactorGenerator.assertionForSignIn(hint.uid, codigoMfa.trim());
     await mfaResolver.resolveSignIn(assertion);
     mfaResolver = null;
   } else {
     await signInWithEmailAndPassword(
        auth,
        email,
        senha
     );
   }

   window.location.href =
   "index.html";

 }catch(error){

   ocultarCarregando();
   btn.disabled = false;
   btn.textContent = "Entrar";
   if (error.code === "auth/multi-factor-auth-required") {
     mfaResolver = getMultiFactorResolver(auth, error);
     mostrarMfa(true);
     document.getElementById("mfaCodigo")?.focus();
   }
   mostrarErro(mensagemErroLogin(error));

 }

}

document.addEventListener("keydown", function(event) {
 const isLoginField =
   event.target &&
   (event.target.id === "email" || event.target.id === "senha" || event.target.id === "mfaCodigo");

 if (isLoginField && event.key === "Enter") {
   event.preventDefault();
   login();
 }
});

window.resetarSenha = async function(){

 const email =
 document.getElementById("email").value;

 if(!email){
   mostrarErro("Informe seu e-mail para recuperar a senha.");
   return;
 }

 try{

   mostrarErro("");
   mostrarCarregando("Enviando recuperação");

   await sendPasswordResetEmail(
      auth,
      email
   );

   ocultarCarregando();

   alert(
    "E-mail de recuperação enviado."
   );

 }catch(error){

   ocultarCarregando();
   const code = error && error.code ? error.code : "";
   let msg = error.message || "Não foi possível enviar o e-mail.";
   if (code === "auth/user-not-found" || code === "auth/invalid-email") {
     msg = "E-mail não encontrado ou inválido. Confirme o endereço cadastrado no portal.";
   } else if (code === "auth/too-many-requests") {
     msg = "Muitas tentativas. Aguarde alguns minutos.";
   }
   mostrarErro(msg);

 }

}

</script>

</body>
</html>
