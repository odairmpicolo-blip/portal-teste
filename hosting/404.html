<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal CIOP</title>
  <script>
    (function () {
      var path = location.pathname + location.search + location.hash;
      if (path.indexOf('/app/') === -1) return;
      if (path === '/app/' || path === '/app/index.html') return;
      try {
        sessionStorage.setItem('portal-spa-redirect', path);
      } catch (e) {}
      location.replace('/app/');
    })();
  </script>
</head>
<body>
  <main>
    <p>404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço não existe neste portal.</p>
  </main>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e8eef8;font-family:system-ui,sans-serif;text-align:center}
    main{padding:32px}
    p:first-child{margin:0 0 8px;letter-spacing:.18em;font-weight:700;color:#7dd3fc}
    h1{margin:0 0 8px;font-size:28px}
    p:last-child{margin:0;color:#9fb0c8}
  </style>
</body>
</html>
